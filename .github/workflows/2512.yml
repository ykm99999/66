name: Sync SL3000 Full Source (Firmware + Bootloader + Tools)

on:
  workflow_dispatch:

env:
  GH_USER: ${{ github.repository_owner }}
  TARGET_REPO: ${{ github.repository }}
  HW_SPI: "25Q256FSSIG"
  HW_DDR4: "P3A8GL4MLF-GJN"
  HW_EMMC: "HSEMSDS7D2B128G"
  SOC: "MT7981B"

jobs:
  sync-full-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # 允许推送代码（GITHUB_TOKEN）
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git Identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Create or switch to branch 2512
        run: |
          BRANCH_NAME="2512"
          git checkout -b $BRANCH_NAME || git checkout $BRANCH_NAME
          git pull origin $BRANCH_NAME || echo "New branch"

      # ---------- ImmortalWrt 官方（已改为 openwrt-25.12）----------
      - name: Sync ImmortalWrt (official)
        run: |
          rm -rf immortalwrt
          git clone --recursive --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git immortalwrt-temp
          rm -rf immortalwrt-temp/.git
          mv immortalwrt-temp immortalwrt
          git add immortalwrt
          git commit -m "Sync: ImmortalWrt official (branch openwrt-25.12) ($(date +'%Y-%m-%d'))" || echo "No changes"

      # ---------- ImmortalWrt (Hanwckf 优化版) ----------
      - name: Sync ImmortalWrt (hanwckf mt798x)
        run: |
          rm -rf immortalwrt-mt798x
          git clone --recursive --depth=1 https://github.com/hanwckf/immortalwrt-mt798x.git immortalwrt-mt798x-temp
          rm -rf immortalwrt-mt798x-temp/.git
          mv immortalwrt-mt798x-temp immortalwrt-mt798x
          git add immortalwrt-mt798x
          git commit -m "Sync: ImmortalWrt hanwckf mt798x ($(date +'%Y-%m-%d'))" || echo "No changes"

      # ---------- ATF (Arm Trusted Firmware) ----------
      - name: Sync ATF
        run: |
          rm -rf arm-trusted-firmware
          git clone --recursive --depth=1 -b mtksoc-20230719 https://github.com/mtk-openwrt/arm-trusted-firmware.git atf-temp
          rm -rf atf-temp/.git
          mv atf-temp arm-trusted-firmware
          git add arm-trusted-firmware
          git commit -m "Sync: ATF (branch mtksoc-20230719) $(date +'%Y-%m-%d')" || echo "No changes"

      # ---------- U-Boot (MediaTek 官方) ----------
      - name: Sync U-Boot (official)
        run: |
          rm -rf u-boot
          git clone --recursive --depth=1 -b mtksoc-20250212 https://github.com/mtk-openwrt/u-boot.git u-boot-temp
          rm -rf u-boot-temp/.git
          mv u-boot-temp u-boot
          git add u-boot
          git commit -m "Sync: U-Boot (branch mtksoc-20250212) $(date +'%Y-%m-%d')" || echo "No changes"

      # ---------- U-Boot (Hanwckf 不死版) ----------
      - name: Sync U-Boot (hanwckf bl-mt798x)
        run: |
          rm -rf bl-mt798x
          git clone --recursive --depth=1 https://github.com/hanwckf/bl-mt798x.git bl-mt798x-temp
          rm -rf bl-mt798x-temp/.git
          mv bl-mt798x-temp bl-mt798x
          git add bl-mt798x
          git commit -m "Sync: hanwckf bl-mt798x ($(date +'%Y-%m-%d'))" || echo "No changes"

      # ---------- mtk_uartboot (救砖工具) ----------
      - name: Sync mtk_uartboot
        run: |
          rm -rf mtk_uartboot
          git clone --depth=1 https://github.com/981213/mtk_uartboot.git mtk_uartboot-temp
          rm -rf mtk_uartboot-temp/.git
          mv mtk_uartboot-temp mtk_uartboot
          git add mtk_uartboot
          git commit -m "Sync: mtk_uartboot ($(date +'%Y-%m-%d'))" || echo "No changes"

      # ---------- 硬件配置与救砖文档 ----------
      - name: Generate SL3000 Hardware Configuration
        run: |
          mkdir -p device/sl3000

          echo "# 司络 SL3000 完整源码与救砖配置" > device/sl3000/README.md
          echo "" >> device/sl3000/README.md
          echo "## 硬件参数（永久记录）" >> device/sl3000/README.md
          echo "- **SoC**: MediaTek MT7981B (Filogic 820)" >> device/sl3000/README.md
          echo "- **WiFi**: MT7976CN (DBDC)" >> device/sl3000/README.md
          echo "- **RAM**: 1GB DDR4 (型号: P3A8GL4MLF-GJN)" >> device/sl3000/README.md
          echo "- **eMMC**: 128GB (型号: HSEMSDS7D2B128G)" >> device/sl3000/README.md
          echo "- **SPI NOR**: 32MB (型号: 25Q256FSSIG)" >> device/sl3000/README.md
          echo "" >> device/sl3000/README.md
          echo "## 🔥 救砖关键步骤" >> device/sl3000/README.md
          echo "1. **使用 mtk_uartboot 加载内存引导**：" >> device/sl3000/README.md
          echo "   - 工具路径：\`/mtk_uartboot\`" >> device/sl3000/README.md
          echo "   - 需要先编译 ATF 生成 \`bl2.bin\`（注意 DDR4 和 BGA 封装）" >> device/sl3000/README.md
          echo "2. **内存降容救砖**：使用 512MB 配置的 BL2 引导（\`DRAM_SIZE=512\`）" >> device/sl3000/README.md
          echo "3. **恢复 1GB 运行内存**：救砖成功后刷入正常 1GB 固件" >> device/sl3000/README.md
          echo "" >> device/sl3000/README.md
          echo "## 分区布局（SPI NOR + eMMC）" >> device/sl3000/README.md
          echo "- **SPI NOR (32MB)**: BL2, FIP, Factory (ART)" >> device/sl3000/README.md
          echo "- **eMMC**: kernel, rootfs, rootfs_data, 用户存储" >> device/sl3000/README.md
          echo "" >> device/sl3000/README.md
          echo "## ATF 编译参数" >> device/sl3000/README.md
          echo '```bash' >> device/sl3000/README.md
          echo "# 512MB 救砖版（DDR4, BGA）" >> device/sl3000/README.md
          echo "make PLAT=mt7981 DEBUG=0 DDR3_FLY=0 USE_NMBM=0 BOOT_DEVICE=emmc LOG_LEVEL=20 DRAM_SIZE=512" >> device/sl3000/README.md
          echo "" >> device/sl3000/README.md
          echo "# 1GB 正常版（DDR4, BGA）" >> device/sl3000/README.md
          echo "make PLAT=mt7981 DEBUG=0 DDR3_FLY=0 USE_NMBM=0 BOOT_DEVICE=emmc LOG_LEVEL=20 DRAM_SIZE=1024" >> device/sl3000/README.md
          echo '```' >> device/sl3000/README.md
          echo "" >> device/sl3000/README.md
          echo "## U-Boot 编译参数" >> device/sl3000/README.md
          echo '```make' >> device/sl3000/README.md
          echo "make mt7981_sl3000_emmc_defconfig  # 需要自行创建此配置" >> device/sl3000/README.md
          echo '```' >> device/sl3000/README.md

          echo "CONFIG_TARGET_mediatek=y" > device/sl3000/config.seed
          echo "CONFIG_TARGET_mediatek_filogic=y" >> device/sl3000/config.seed
          echo "CONFIG_TARGET_mediatek_filogic_Device_sl3000=y" >> device/sl3000/config.seed
          echo "CONFIG_MTK_NAND_EMC=y" >> device/sl3000/config.seed
          echo "CONFIG_PACKAGE_kmod-mt7915e=y" >> device/sl3000/config.seed
          echo "CONFIG_DRAM_SIZE=1024" >> device/sl3000/config.seed

          git add device/sl3000
          git commit -m "docs: add SL3000 full source config and rescue guide" || echo "Config exists"

      # ---------- 推送至您的仓库（使用 PAT）----------
      - name: Push to your repository
        run: |
          BRANCH_NAME="2512"
          git push https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }} $BRANCH_NAME --force
