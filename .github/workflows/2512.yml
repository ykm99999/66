name: Sync SL3000 Full Source

on:
  workflow_dispatch:

env:
  GH_USER: ${{ github.repository_owner }}
  TARGET_REPO: ${{ github.repository }}

jobs:
  sync-full-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write                     # 授权写入（使用 GITHUB_TOKEN）
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git Identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Create or switch to branch
        run: |
          BRANCH_NAME="2512"
          git checkout -b $BRANCH_NAME || git checkout $BRANCH_NAME
          git pull origin $BRANCH_NAME || echo "New branch"

      # ---------- ImmortalWrt 官方（openwrt-25.12） ----------
      - name: Sync ImmortalWrt (official)
        run: |
          rm -rf immortalwrt
          git clone --recursive --depth=1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git immortalwrt-temp
          rm -rf immortalwrt-temp/.git
          mv immortalwrt-temp immortalwrt
          git add immortalwrt
          git commit -m "Sync: ImmortalWrt official (branch openwrt-25.12) ($(date +'%Y-%m-%d'))" || echo "No changes"

      # ---------- 其余克隆步骤（保持原样） ----------
      # ... 您原有的其他 clone 步骤 ... 
      # 注意：请确保所有同步步骤都已包含，此处省略以保持简洁

      # ---------- 推送至您的仓库 ----------
      - name: Push to your repository
        run: |
          BRANCH_NAME="2512"
          # 如需使用 PAT，取消下一行注释并注释掉下行
          # git push https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }} $BRANCH_NAME --force
          git push origin $BRANCH_NAME --force
