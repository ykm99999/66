name: Sync 2410 Branch from Upstream (Manual only)

on:
  workflow_dispatch:

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch 2410 branch
        run: |
          git remote add upstream https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
          git fetch upstream 2410 --depth=1

      - name: Force push to your 2410 branch
        run: |
          # 使用完整的 ref 格式指定目标分支
          git push --force origin refs/remotes/upstream/2410:refs/heads/2410
