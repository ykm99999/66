name: SL3000-5.4内核-V17物理锚定

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410
  CONFIG_FILE: 888/sl3000.config

jobs:
  fix_v17:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出
        uses: actions/checkout@v4

      - name: 环境部署
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential gawk git python3 curl

      - name: 源码溯源
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a || true

      - name: 物理锚定执行 (V17)
        run: |
          chmod +x diy-part2.sh
          cd openwrt && ../diy-part2.sh

      - name: 物理提取 (Diffconfig)
        run: |
          cd openwrt
          # 原子化补全，强制不进入交互模式
          make oldconfig < /dev/null
          # 提取静态种子
          ./scripts/diffconfig.sh > ../$CONFIG_FILE

      - name: 物理最终审计
        run: |
          echo "执行 V17 物理终极校验..."
          if grep -q "CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y" $CONFIG_FILE; then
             echo "✅ 物理定论：架构已彻底锁死，5.4内核零件已完成物理对齐！"
          else
             echo "❌ 物理报错：种子中未发现标识符！"
             # 深度诊断：看看 .config 到底变成了什么
             grep "CONFIG_TARGET" openwrt/.config
             exit 1
          fi

      - name: 原子化同步推送
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Physical-Bot"
          git add $CONFIG_FILE
          git commit -m "Ultimate Fix: V17 Physical Anchor 5.4" || exit 0
          git push
