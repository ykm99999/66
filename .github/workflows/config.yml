name: SL3000-终极解决-V12全物理强占

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410
  CONFIG_FILE: 888/sl3000.config

jobs:
  ultimate_fix:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出
        uses: actions/checkout@v4

      - name: 环境部署
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential gawk git python3

      - name: 源码溯源
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a || true

      - name: 物理强占执行 (DIY Step)
        run: |
          chmod +x diy-part2.sh
          cd openwrt && ../diy-part2.sh

      - name: 物理提取 (Diffconfig)
        run: |
          cd openwrt
          # 物理补全必需依赖 (静默模式)
          make oldconfig < /dev/null
          # 提取种子
          ./scripts/diffconfig.sh > ../$CONFIG_FILE

      - name: 物理最终审计 (核弹级校验)
        run: |
          echo "执行物理终极校验..."
          if grep -q "CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y" $CONFIG_FILE; then
             echo "✅ 物理定论：架构已彻底锁死，SL3000 身份已通过物理强占获得！"
          else
             echo "❌ 物理报错：请检查 888/mt7981.mk 文件内的定义是否包含 Device/sl_3000-emmc"
             exit 1
          fi

      - name: 原子化同步推送
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Physical-Bot"
          git add $CONFIG_FILE
          git commit -m "Ulitmate Fix: SL3000 V12 物理强占闭环" || exit 0
          git push
