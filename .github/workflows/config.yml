name: SL3000-V18-物理强占-唯一架构

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410
  CONFIG_FILE: 888/sl3000.config

jobs:
  fix_v18:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出
        uses: actions/checkout@v4

      - name: 环境部署
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential gawk git python3 curl

      - name: 源码溯源
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a || true

      - name: 物理锚定执行 (V18)
        run: |
          chmod +x diy-part2.sh
          cd openwrt && ../diy-part2.sh

      - name: 物理锁定提取
        run: |
          cd openwrt
          # 强制补全依赖，不给系统修正机会
          printf '\n' | make oldconfig
          # 直接提取
          ./scripts/diffconfig.sh > ../$CONFIG_FILE

      - name: 物理最终审计
        run: |
          echo "执行 V18 物理审计..."
          if grep -q "DEVICE_sl_3000-emmc=y" $CONFIG_FILE; then
             echo "✅ 物理定论：SL3000 标识符终于在物理层面唯一化成功！"
          else
             echo "❌ 物理报错：即使删除了 x86，系统依然不认标识符！"
             echo "--- 深度诊断：当前激活的架构是 ---"
             grep "CONFIG_TARGET" openwrt/.config | grep "=y"
             exit 1
          fi

      - name: 原子化推送
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Physical-Bot"
          git add $CONFIG_FILE
          git commit -m "Ultimate Fix: V18 Force Mediatek Only" || exit 0
          git push
