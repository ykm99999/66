name: SL3000-V22-物理强攻-捕获标识符

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410
  CONFIG_FILE: 888/sl3000.config

jobs:
  capture_v22:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出仓库
        uses: actions/checkout@v4

      - name: 工业环境部署
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential gawk git python3 curl

      - name: 源码克隆与 Feeds 处理
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a || true

      - name: 物理强攻执行 (V22)
        run: |
          chmod +x diy-part2.sh
          cd openwrt && ../diy-part2.sh

      - name: 物理种子强行收割
        run: |
          cd openwrt
          # 物理隔离备份
          cp .config .config.bak
          
          # 执行原子化补全
          printf '\n' | make oldconfig
          
          # 【物理熔断机制】如果发现系统漂移回 x86，物理强行写回
          if grep -q "CONFIG_TARGET_x86=y" .config; then
            echo "⚠️ 检测到非法漂移回 x86，正在物理强制回灌..."
            cp .config.bak .config
          fi
          
          # 最终提取：只提取标识符差异
          ./scripts/diffconfig.sh > ../$CONFIG_FILE

      - name: 物理最终审计
        run: |
          echo "执行 V22 物理审计..."
          if grep -q "DEVICE_sl_3000-emmc=y" $CONFIG_FILE; then
             echo "✅ 物理定论：第 22 次尝试，SL3000 标识符终于被物理捕获！"
          else
             echo "❌ 物理报错：种子依然不包含标识符！内容如下："
             cat $CONFIG_FILE
             exit 1
          fi

      - name: 原子化同步推送
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Physical-Bot"
          git add $CONFIG_FILE
          git commit -m "Ultimate Fix: V22 Physical Capture" || exit 0
          git push
