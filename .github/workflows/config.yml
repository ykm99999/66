name: SL3000-V19-架构全量置换

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410
  CONFIG_FILE: 888/sl3000.config

jobs:
  fix_v19:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出
        uses: actions/checkout@v4

      - name: 环境部署
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential gawk git python3 curl

      - name: 源码溯源
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a || true

      - name: 物理置换执行 (V19)
        run: |
          chmod +x diy-part2.sh
          # 注意：V19 脚本会执行 git clone，需要确保在主目录执行
          ./diy-part2.sh
          # 脚本执行完毕后将 .config 移动到 openwrt 目录
          mv .config openwrt/

      - name: 物理锁定提取
        run: |
          cd openwrt
          # 物理补全依赖
          printf '\n' | make oldconfig
          # 产生静态种子
          ./scripts/diffconfig.sh > ../$CONFIG_FILE

      - name: 物理最终审计
        run: |
          echo "执行 V19 物理终极校验..."
          if grep -q "DEVICE_sl_3000-emmc=y" $CONFIG_FILE; then
             echo "✅ 物理定论：架构全量置换成功，SL3000 身份已通过原生继承获得！"
          else
             echo "❌ 物理报错：即使置换了整个架构目录，系统依然不认标识符！"
             echo "--- 深度诊断：查看 filogic.mk 实际内容 ---"
             cat openwrt/target/linux/mediatek/image/filogic.mk
             exit 1
          fi

      - name: 原子化推送
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Physical-Bot"
          git add $CONFIG_FILE
          git commit -m "Ultimate Fix: V19 Total Architecture Replacement" || exit 0
          git push
