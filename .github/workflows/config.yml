name: SL3000-V20-物理渗透-最终锁定

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410
  CONFIG_FILE: 888/sl3000.config

jobs:
  fix_v20:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出
        uses: actions/checkout@v4

      - name: 环境部署
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential gawk git python3 curl

      - name: 源码溯源
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a || true

      - name: 物理渗透执行 (V20)
        run: |
          chmod +x diy-part2.sh
          cd openwrt && ../diy-part2.sh

      - name: 物理强制锁定提取
        run: |
          cd openwrt
          # 执行补全，即使它报错我们也继续
          make oldconfig < /dev/null || true
          
          # 提取前进行物理确认，如果标识符丢了，强制补回
          if ! grep -q "DEVICE_sl_3000-emmc=y" .config; then
             echo "检测到系统尝试抹除标识符，执行物理强制回灌..."
             echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y" >> .config
          fi
          
          ./scripts/diffconfig.sh > ../$CONFIG_FILE

      - name: 物理终极审计
        run: |
          echo "执行 V20 物理终极校验..."
          if grep -q "DEVICE_sl_3000-emmc=y" $CONFIG_FILE; then
             echo "✅ 物理定论：标识符已通过渗透逻辑锁定！"
          else
             echo "❌ 物理报错：标识符在种子中依然缺失！"
             echo "--- 深度诊断：寻找标识符在全源码的位置 ---"
             grep -r "sl_3000-emmc" openwrt/target/linux/mediatek/
             exit 1
          fi

      - name: 原子化推送
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Physical-Bot"
          git add $CONFIG_FILE
          git commit -m "Ultimate Fix: V20 Physical Penetration" || exit 0
          git push
