name: SL3000-旗舰工厂-种子净化-V10终极版

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410
  CONFIG_FILE: 888/sl3000.config
  TZ: Asia/Shanghai

jobs:
  factory_audit:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 工业环境部署
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential gawk git python3
          sudo timedatectl set-timezone "$TZ"

      - name: 源码溯源
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a || true

      - name: 执行物理注入 (Call DIY Script)
        run: |
          chmod +x diy-part2.sh
          # 物理隔离运行脚本，确保在 openwrt 目录下执行
          cd openwrt && ../diy-part2.sh

      - name: 物理原子化补全
        run: |
          cd openwrt
          # 1. 强制补全必需依赖 (oldconfig 模式)
          printf '\n' | make oldconfig
          
          # 2. 物理二次锁死（防止 oldconfig 修正回默认值）
          sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=20/' .config
          
          # 3. 产生膨胀后的完整配置并提取静态种子
          make defconfig
          ./scripts/diffconfig.sh > ../$CONFIG_FILE

      - name: 旗舰级物理审计 (V10 Final)
        run: |
          echo "执行 V10 物理审计..."
          # 审计 A: 标识符存活校验
          if grep -q "CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y" $CONFIG_FILE; then
            echo "✅ 旗舰工厂：sl_3000-emmc 物理身份锁定成功"
          else
            echo "❌ 物理错误：身份依然丢失！当前种子状态："
            cat $CONFIG_FILE
            exit 1
          fi
          
          # 审计 B: 救砖空间校验
          grep -q "CONFIG_TARGET_ROOTFS_PARTSIZE=20" $CONFIG_FILE || (echo "❌ 物理错误：20MB 空间锁定失败！" && exit 1)

      - name: 原子化同步推送
        run: |
          git config --global user.email "factory-bot@github.com"
          git config --global user.name "Flagship-Factory-Bot"
          git add $CONFIG_FILE
          git commit -m "Factory: SL3000 V10 原子级闭环配置" || exit 0
          git push
