name: SL3000-V21-净化收割-最终版

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410
  CONFIG_FILE: 888/sl3000.config

jobs:
  harvest_v21:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出
        uses: actions/checkout@v4

      - name: 环境部署
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential gawk git python3 curl

      - name: 源码溯源
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a || true

      - name: 物理渗透与净化 (V21)
        run: |
          chmod +x diy-part2.sh
          cd openwrt && ../diy-part2.sh

      - name: 物理种子收割
        run: |
          cd openwrt
          # 物理补全依赖
          make oldconfig < /dev/null
          
          # 【二次净化】物理抹除 oldconfig 偷偷加上的 MT7622 残留
          sed -i '/CONFIG_TARGET_mediatek_mt7622/d' .config
          echo "# CONFIG_TARGET_mediatek_mt7622 is not set" >> .config
          
          # 提取纯净 diffconfig
          ./scripts/diffconfig.sh > ../$CONFIG_FILE

      - name: 物理最终审计
        run: |
          echo "执行 V21 物理终极校验..."
          if grep -q "DEVICE_sl_3000-emmc=y" $CONFIG_FILE && ! grep -q "mt7622=y" $CONFIG_FILE; then
             echo "✅ 物理定论：SL3000 标识符已达成纯净锁定，无任何寄生架构！"
          else
             echo "❌ 物理报错：种子中发现非法残留！内容如下："
             cat $CONFIG_FILE
             exit 1
          fi

      - name: 原子化同步推送
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Physical-Bot"
          git add $CONFIG_FILE
          git commit -m "Ultimate Fix: V21 Pure Harvest" || exit 0
          git push
