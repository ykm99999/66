name: Build SL3000 Rescue Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify required files in 888/
        run: |
          cd 888
          missing=0
          for f in bl2_orig.bin fip_orig.bin factory_orig.bin; do
            if [ ! -f "$f" ]; then
              echo "::warning::Missing $f, will create placeholder."
            fi
          done
          echo "File check completed."

      - name: Assemble rescue image
        run: |
          chmod +x assemble_rescue.sh
          ./assemble_rescue.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-bundle
          path: output/

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SL3000 Rescue ${{ github.ref_name }}"
          files: |
            output/Spi-flash-32MB-rescue.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
