name: Build SL3000 Rescue Full Kit

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: '固件版本号'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - name: Checkout main repository (脚本与配置)
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout source repositories (底层源码)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          path: source-repo
          sparse-checkout: |
            immortalwrt
            u-boot
            arm-trusted-firmware
            mtk_uartboot
          sparse-checkout-cone-mode: false

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison libncurses-dev \
            libssl-dev libelf-dev bc u-boot-tools device-tree-compiler \
            gcc-aarch64-linux-gnu python3 python3-pip wget unzip file tree \
            cpio rsync

      - name: Setup environment variables
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "VERSION_NUMBER=${{ github.event.inputs.version_number }}" >> $GITHUB_ENV
          echo "VERSION_CODE=r$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Grant execute permission to scripts
        working-directory: main-repo
        run: chmod +x diy-part1.sh diy-part2.sh

      - name: Run diy-part1.sh (配置 ImmortalWrt)
        working-directory: main-repo
        run: ./diy-part1.sh

      - name: Run diy-part2.sh (编译 ATF/U-Boot/固件)
        working-directory: main-repo
        run: ./diy-part2.sh

      - name: Generate 32M Rescue Image
        run: |
          mkdir -p output
          cd output
          # 从编译输出收集所需文件
          cp $GITHUB_WORKSPACE/main-repo/output/atf/bl2-ram-1g.bin bl2-emmc-ddr4.bin
          cp $GITHUB_WORKSPACE/main-repo/output/uboot/fip-emmc.bin bl31-uboot-emmc-ddr4.fip
          # 查找 sysupgrade 文件（可能是 .bin 或 .img.gz）
          SYS=$(find $GITHUB_WORKSPACE/main-repo/output/firmware -name "*sysupgrade*" | head -1)
          cp "$SYS" sysupgrade.itb 2>/dev/null || true
          # 合成 32M 镜像
          IMAGE_SIZE=$((32 * 1024 * 1024))
          dd if=/dev/zero bs=1M count=32 | tr '\000' '\377' > rescue-32M.bin
          dd if=bl2-emmc-ddr4.bin of=rescue-32M.bin bs=1K seek=0 conv=notrunc
          dd if=bl31-uboot-emmc-ddr4.fip of=rescue-32M.bin bs=1K seek=1024 conv=notrunc
          dd if=bl31-uboot-emmc-ddr4.fip of=rescue-32M.bin bs=1K seek=2048 conv=notrunc
          dd if=sysupgrade.itb of=rescue-32M.bin bs=1K seek=3072 conv=notrunc
          md5sum rescue-32M.bin > rescue-32M.bin.md5
          ls -lh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Rescue-Kit
          path: |
            main-repo/output/atf/*.bin
            main-repo/output/uboot/*.bin
            main-repo/output/firmware/*.bin
            main-repo/output/firmware/*.img.gz
            main-repo/output/mtk_uartboot.tar.gz
            output/rescue-32M.bin
            output/rescue-32M.bin.md5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NUMBER }}-${{ github.run_number }}
          name: SL3000 Firmware ${{ env.VERSION_NUMBER }}
          body_path: main-repo/output/firmware/build.log
          files: |
            output/rescue-32M.bin
            output/rescue-32M.bin.md5
            main-repo/output/mtk_uartboot.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
