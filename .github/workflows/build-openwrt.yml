name: SL3000-V1-Physical-Return

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Actions Repo
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Clone OpenWrt Source
      run: |
        # 物理克隆 ykm888/66 的 2410 分支
        git clone --depth 1 https://github.com/ykm888/66 -b 2410 openwrt

    - name: Load Config & Force Architecture
      run: |
        # 1. 物理检查根目录下的种子配置
        if [ -f "sl3000.config" ]; then
            echo "物理校准：发现根目录配置，开始注入..."
            sed -i 's/\r$//' sl3000.config
            
            # 2. 物理锁定：强制置顶目标架构 (单箭头 > 杀死 x86 记忆)
            echo "CONFIG_TARGET_mediatek=y" > openwrt/.config
            echo "CONFIG_TARGET_mediatek_filogic=y" >> openwrt/.config
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y" >> openwrt/.config
            
            # 3. 追加配置内容
            cat sl3000.config >> openwrt/.config
        else
            echo "物理致命错误：根目录下未发现 sl3000.config！"
            ls -F
            exit 1
        fi

    - name: Run DIY Scripts
      run: |
        chmod +x diy-part2.sh
        ./diy-part2.sh

    - name: Build Toolchain
      run: |
        cd openwrt
        make defconfig
        make tools/install -j$(nproc)
        make toolchain/install -j$(nproc)

    - name: Compile Components
      run: |
        cd openwrt
        # 物理精准打击救砖零件
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
        make package/boot/uboot-mediatek/compile V=s -j1
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-V1-Recovery
        path: openwrt/bin/targets/mediatek/filogic/*
