name: SL3000-Build-Final-Fix

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 888/sl3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential gawk git python3
          sudo timedatectl set-timezone "$TZ"

      - name: Clone source code
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && cp -f $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          ./$GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update & Install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          # 1. 注入种子配置 (3000行全量版)
          [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          
          # 2. 物理自动补全 (彻底解决 [NEW] 交互提问)
          # defconfig 会自动给所有新包选 N，不会卡死，不会报 Broken pipe
          make defconfig
          
          # 3. 物理二次覆盖 (彻底解决分区被冲掉)
          # 在补全后运行脚本，确保 PARTSIZE 和 eMMC 驱动被强制设为正确值
          GITHUB_WORKSPACE=$GITHUB_WORKSPACE bash $GITHUB_WORKSPACE/$DIY_P2_SH
          
          # 4. 锁定最终配置
          make oldconfig

      - name: Download package
        run: |
          cd openwrt
          make download -j8

      - name: Compile the firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Organize files
        run: |
          cd openwrt/bin/targets/*/*
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: SL3000_Firmware
          path: ${{ env.FIRMWARE }}/*nor-programmer-dump.bin
