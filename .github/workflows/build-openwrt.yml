name: SL-3000 Manual Hardened Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gawk libncurses5-dev gettext libssl-dev xsltproc wget
          git clone --depth 1 https://github.com/coolsnowwolf/lede openwrt
          cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Physical Patching
        run: |
          chmod +x diy-part2.sh
          cd openwrt
          ../diy-part2.sh

      - name: Build Toolchain
        run: |
          cd openwrt
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: Compile Hardened Parts
        run: |
          cd openwrt
          make package/boot/arm-trusted-firmware-mediatek/compile V=s
          make package/boot/uboot-mediatek/compile V=s
          make target/linux/mediatek/image/compile V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Fixed-Firmware
          path: openwrt/bin/targets/mediatek/filogic/*
