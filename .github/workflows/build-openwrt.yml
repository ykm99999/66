name: SL3000 Final Build with SPI-32MB Auto Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Generate release tag
        id: release_tag
        run: |
          TAG_NAME="v$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      # ========== 1. 缓存逻辑修复 (增加对 DTS 和 MK 的感知) ==========
      - name: Cache OpenWrt
        id: cache-openwrt
        uses: actions/cache@v4
        with:
          path: |
            immortalwrt-build/dl
            immortalwrt-build/.config
          # 关键：当 888 目录下的 DTS 或 MK 改变时，必须自动失效旧缓存，否则全量包不会生成
          key: ${{ runner.os }}-openwrt-v5-${{ hashFiles('main-repo/888/*') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-v5-

      # ========== 2. 执行物理对齐脚本 (diy-part1 & part2) ==========
      - name: Run Configuration & Compile
        run: |
          chmod +x main-repo/diy-part1.sh
          chmod +x main-repo/diy-part2.sh
          # 先注入配置、DTS、和 MK 定义
          cd main-repo
          ./diy-part1.sh
          # 执行编译 (内部包含 dd 缝合逻辑)
          ./diy-part2.sh

      # ========== 3. 产物像素级验证 (确保全量包存在) ==========
      - name: Audit Firmware Output
        run: |
          echo "=== [Audit] Checking for 32MB Rescue Image ==="
          if [ -f "output/firmware/Spi-flash-32MB.bin" ]; then
             FILE_SIZE=$(stat -c%s "output/firmware/Spi-flash-32MB.bin")
             echo "✅ Found Spi-flash-32MB.bin, Size: $FILE_SIZE bytes"
          else
             echo "❌ ERROR: Spi-flash-32MB.bin not found!"
             exit 1
          fi

      # ========== 4. 发布救砖全家桶 (Release) ==========
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 SPI-32MB Full Rescue Kit"
          body: |
            ## 🚀 SL3000 救砖全家桶 (1GB RAM 专用)
            - **Spi-flash-32MB.bin**: 32MB 物理全量包 (0x0 烧录救砖)
            - **sysupgrade.bin**: OpenWrt 网页升级包
            - **ATF/U-Boot**: 独立的引导分体包
            - **mtk_uartboot**: 串口引导工具
            ---
            *注意：请使用编程器直接刷入 32MB 全量包，无需设置偏移。*
          files: |
            output/atf/*.bin
            output/uboot/*.bin
            output/firmware/Spi-flash-32MB.bin
            output/firmware/*sysupgrade.bin
            output/mtk_uartboot.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: Full-Rescue-Kit-${{ steps.release_tag.outputs.tag_name }}
          path: output/
