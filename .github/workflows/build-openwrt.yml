name: SL3000 Rescue Final Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TERM: xterm
      FORCE_UNSAFE_CONFIGURE: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # 像素级补全：添加构建 host-tools 必须的 libssl-dev 和核心开发库
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential device-tree-compiler \
          bison flex m4 gawk gettext libncursesw5-dev libncurses5-dev zlib1g-dev \
          python3-setuptools swig python3-dev rsync unzip git qemu-utils libssl-dev

      - name: Prepare Environment (diy-part1)
        run: |
          chmod +x diy-part1.sh
          ./diy-part1.sh

      - name: Build and Package (diy-part2)
        run: |
          # 物理执行：触发内核编译与镜像合成
          chmod +x diy-part2.sh
          export GITHUB_WORKSPACE=$GITHUB_WORKSPACE
          ./diy-part2.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-bundle
          path: output/
