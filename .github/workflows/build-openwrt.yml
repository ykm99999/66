name: SL3000 Slim Build

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout config branch (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: config-repo

      - name: Checkout source branch (sl3000-full-sync)
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Install basic dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget curl unzip file \
            gcc-aarch64-linux-gnu libncurses-dev libssl-dev python3

      - name: Run DIY script
        run: |
          chmod +x diy-part1.sh
          ./diy-part1.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-firmware
          path: output/
