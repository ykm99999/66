name: Build SL3000 Rescue SPI Image

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '888/**'
      - '.github/workflows/build-sl3000-rescue.yml'
  workflow_dispatch:          # 允许手动触发

env:
  OPENWRT_VERSION: "v23.05.4"       # 稳定版本，可根据需要调整
  BUILD_THREADS: "4"                # 编译并行线程数
  SPI_FLASH_SIZE_MB: "32"           # SPI NOR 容量

jobs:
  build-rescue:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      # ------------------------------------------------------------
      # 1. 检出代码（包含 888/ 目录下的三件套）
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. 安装编译依赖（包括 gdisk 用于 sgdisk）
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3 python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
          file wget cpio unzip gdisk

      # ------------------------------------------------------------
      # 3. 准备 OpenWrt 源码并整合配置文件
      # ------------------------------------------------------------
      - name: Prepare OpenWrt source and inject configs
        run: |
          echo "Cloning OpenWrt $OPENWRT_VERSION ..."
          git clone --depth=1 --branch $OPENWRT_VERSION https://github.com/openwrt/openwrt.git openwrt
          cd openwrt

          # 复制三件套到正确位置
          echo "Copying SL3000 configuration files..."
          cp ../888/sl3000-rescue.config .config
          cp ../888/mt7981b-sl3000-emmc.dts target/linux/mediatek/dts/
          cp ../888/mt7981_sl3000.mk target/linux/mediatek/image/

          # 更新 feeds 并安装所有包定义
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ------------------------------------------------------------
      # 4. 开始编译（工具链 + 目标固件组件）
      # ------------------------------------------------------------
      - name: Build toolchain and rescue components
        run: |
          cd openwrt
          make defconfig
          make -j $BUILD_THREADS download
          make -j $BUILD_THREADS tools/install
          make -j $BUILD_THREADS toolchain/install
          # 编译内核及目标模块
          make -j $BUILD_THREADS target/linux/compile
          # 编译必要的启动固件包（ATF、U-Boot）
          make -j $BUILD_THREADS package/boot/arm-trusted-firmware-mediatek/compile
          make -j $BUILD_THREADS package/boot/uboot-mediatek/compile
          # 此时 Makefile 中的 gen_spi_gpt 和 gen_spi_full_image 规则会自动执行
          # 最终在 bin/targets/mediatek/filogic/ 下生成所需文件

      # ------------------------------------------------------------
      # 5. 收集并整理构建产物
      # ------------------------------------------------------------
      - name: Collect artifacts
        run: |
          mkdir -p rescue-output
          cd openwrt

          # 查找并复制所有相关输出
          # GPT 分区表
          find bin/targets/mediatek/filogic/ -name "gpt.bin" -exec cp {} ../rescue-output/ \;
          # 完整 SPI 镜像
          find bin/targets/mediatek/filogic/ -name "spi-full-32mb.bin" -exec cp {} ../rescue-output/ \;
          # BL2 引导文件
          find bin/targets/mediatek/filogic/ -name "bl2.img" -exec cp {} ../rescue-output/ \;
          find bin/targets/mediatek/filogic/ -name "bl2.bin" -exec cp {} ../rescue-output/ \;
          # FIP 镜像（ATF BL31 + U-Boot）
          find bin/targets/mediatek/filogic/ -name "fip.bin" -exec cp {} ../rescue-output/ \;
          # 设备树 Blob
          find build_dir/target-aarch64_cortex-a53_musl/linux-mediatek_filogic/ -name "*.dtb" -exec cp {} ../rescue-output/ \;
          # Initramfs 内核（救援用）
          find bin/targets/mediatek/filogic/ -name "*initramfs-kernel.bin" -exec cp {} ../rescue-output/ \;

          # 生成文件列表便于核对
          ls -lah ../rescue-output/ > ../rescue-output/filelist.txt

      # ------------------------------------------------------------
      # 6. 上传产物到 GitHub Actions Artifact
      # ------------------------------------------------------------
      - name: Upload rescue artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-spi-full
          path: rescue-output/
          retention-days: 30
