name: SL3000 Final Build

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Install full dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Run build script
        run: |
          chmod +x main-repo/diy-part1.sh
          cd main-repo
          ./diy-part1.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-firmware
          path: main-repo/output/
