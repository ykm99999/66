name: SL3000-Recovery-V16-Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Actions Repo
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Clone Source
      run: |
        # 物理克隆 ykm888/66 到底层目录 openwrt
        git clone https://github.com/ykm888/66 -b 2410 openwrt

    - name: Load Config From 888 Directory
      run: |
        cd openwrt
        # --- 物理绝对定位：指定 888/sl3000.config ---
        if [ -f "888/sl3000.config" ]; then
            echo "物理校准：已定位到 888/sl3000.config，开始强行应用..."
            # 1. 物理清洗
            sed -i 's/\r$//' 888/sl3000.config
            # 2. 物理重置并注入架构标识 (单箭头覆盖旧记忆)
            echo "CONFIG_TARGET_mediatek=y" > .config
            echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y" >> .config
            # 3. 物理合并
            cat 888/sl3000.config >> .config
        else
            echo "物理致命错误：文件不在 openwrt/888/sl3000.config！"
            echo "当前目录下的 888 文件夹内容："
            ls -R 888/ || echo "888 文件夹根本不存在！"
            exit 1
        fi
        
        # 执行脚本 (脚本在 openwrt 的父目录)
        chmod +x ../diy-part2.sh
        ../diy-part2.sh
        
        make defconfig

    - name: Build Toolchain
      run: |
        cd openwrt
        # 物理构建 ARM 交叉编译环境
        make tools/install -j$(nproc)
        make toolchain/install -j$(nproc)

    - name: Compile Components
      run: |
        cd openwrt
        # 物理精准打击
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
        make package/boot/uboot-mediatek/compile V=s -j1
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-V16-Binaries
        path: openwrt/bin/targets/mediatek/filogic/*
