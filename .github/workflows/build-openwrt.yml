name: Build SL3000 Recovery V9

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: 2410
  CONFIG_FILE: sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Actions Repo
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone Custom Source
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        
        echo "=== 物理审计：Makefile 二进制结构 (期待看到 ^I) ==="
        cat -A package/boot/arm-trusted-firmware-mediatek/Makefile | head -n 50
        
        make defconfig

    - name: Download Package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the Firmware
      run: |
        cd openwrt
        echo "物理编译：ATF 引导零件..."
        # 强制单线程编译以捕捉物理报错位置
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
        
        echo "物理编译：U-Boot 引导零件..."
        make package/boot/uboot-mediatek/compile V=s -j1
        
        echo "物理编译：完整固件..."
        make -j$(nproc) || make -j1 V=s

    - name: Organize Files
      if: success()
      run: |
        cd openwrt/bin/targets/mediatek/filogic
        mkdir -p $GITHUB_WORKSPACE/release
        cp *sl_3000*factory.bin $GITHUB_WORKSPACE/release/ 2>/dev/null || true
        cp *bl2.img $GITHUB_WORKSPACE/release/ 2>/dev/null || true
        cp *u-boot.fip $GITHUB_WORKSPACE/release/ 2>/dev/null || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-V9-Recovery
        path: release/*
