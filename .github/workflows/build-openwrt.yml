name: SL-3000 Recovery Build 24.10

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  DIY_P2_SH: diy-part2.sh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 物理检出代码
        uses: actions/checkout@v4

      - name: 环境筑基 (Ubuntu 22.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gawk libncurses5-dev gettext libssl-dev xsltproc wget zstd
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: 更新并安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 物理零件预装
        run: |
          chmod +x $DIY_P2_SH
          cd openwrt
          # 执行脚本：将 888 目录下的零件预埋到 package/boot/.../files/
          ../$DIY_P2_SH

      - name: 物理配置硬化
        run: |
          cd openwrt
          # 1. 尝试应用种子配置
          [ -f .config ] || cp ../888/sl3000.config .config
          
          # 2. 【核心修复】：强行锁定救砖包选中状态，防止 skipping
          echo "CONFIG_PACKAGE_arm-trusted-firmware-mediatek=y" >> .config
          echo "CONFIG_PACKAGE_uboot-mediatek-mt7981_sl3000_nor=y" >> .config
          
          # 3. 补全配置依赖
          make defconfig

      - name: 编译编译工具 (Tools)
        run: |
          cd openwrt
          make tools/install -j$(nproc) || make tools/install -j1 V=s

      - name: 编译交叉编译器 (Toolchain)
        run: |
          cd openwrt
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: 编译救砖版 ATF
        run: |
          cd openwrt
          # 触发 Makefile 中的 Build/Prepare 进行代码注入
          make package/boot/arm-trusted-firmware-mediatek/compile V=s

      - name: 编译救砖版 U-Boot
        run: |
          cd openwrt
          # 指向明确的 variant 路径，防止逻辑跳过
          make package/boot/uboot-mediatek/mt7981_sl3000_nor/compile V=s

      - name: 物理合成镜像
        run: |
          cd openwrt
          # 修正 target 指令，24.10 标准镜像合成路径
          make target/linux/mediatek/image/install V=s

      - name: 上传救砖产物
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-NOR-Recovery-Package
          path: |
            openwrt/bin/targets/mediatek/filogic/*.bin
            openwrt/bin/targets/mediatek/filogic/*.img
