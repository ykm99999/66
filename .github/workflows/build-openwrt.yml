name: sl3000-auto-physical-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      KCONFIG_NOSILENTUPDATE: 1
      CONF_DEFAULT: 1
      FORCE_UNSAFE_CONFIGURE: 1

    steps:
      - name: 1. 物理检出 (checkout)
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: 2. 源码注入 (clone immortalwrt)
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: 3. 环境初始化
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential device-tree-compiler \
          bison flex m4 gawk gettext libncursesw5-dev libncurses5-dev zlib1g-dev \
          python3-setuptools swig python3-dev rsync unzip git qemu-utils libssl-dev

      - name: 4. 物理对齐：注入配置与设备树
        run: |
          cd openwrt
          
          # [a] 物理对齐官方 MK 格式 (防御性操作)
          # 即使还原了官方版，也强制进行一次 Tab 纠偏，防止 Git 检出导致的空格污染
          sed -i 's/^    /\t/g' target/linux/mediatek/image/filogic.mk
          
          # [b] 注入设备树 (dts) - 保持官方架构路径映射
          cp -f ../main-repo/888/mt7981b-sl3000-emmc.dts target/linux/mediatek/dts/mt7981b-sl-3000-emmc.dts
          
          # [c] 注入配置母本 (.config) - 核心驱动逻辑
          cp -f ../main-repo/888/sl3000.config .config
          
          # [d] 物理致盲：封印交互
          mkdir -p scripts/config
          echo "exit 1" > scripts/config/mconf-cfg.sh
          chmod +x scripts/config/mconf-cfg.sh

      - name: 5. 自动配置补全 (物理封印交互)
        run: |
          cd openwrt
          ./scripts/feeds update -a && ./scripts/feeds install -a
          # 使用 olddefconfig 自动闭合所有 SSL Library 等 choice 选项
          make olddefconfig
          make defconfig

      - name: 6. 物理编译 (toolchain & kernel)
        run: |
          cd openwrt
          # 物理执行：先工具链，后内核
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
          make target/linux/compile -j$(nproc) V=s

      - name: 7. 救砖包物理合成 (外部逻辑)
        run: |
          mkdir -p output
          cd openwrt
          # 物理溯源：在官方 bin 目录下寻找由 sl3000.config 编译出的内核镜像
          KERNEL_SRC=$(find bin/targets -name "*sysupgrade.itb" | head -n 1)
          RESCUE_BIN="../output/rescue-32.bin"
          REPO_888="../main-repo/888"
          
          # 物理合成 32MB 镜像 (0xFF 填充)
          dd if=/dev/zero bs=1M count=32 | tr '\000' '\377' > "$RESCUE_BIN"
          
          # 像素级偏移写入 (基于 3MB 偏移对齐)
          [ -f "$REPO_888/bl2_orig.bin" ] && dd if="$REPO_888/bl2_orig.bin" of="$RESCUE_BIN" conv=notrunc status=none
          [ -f "$REPO_888/fip_orig.bin" ] && dd if="$REPO_888/fip_orig.bin" of="$RESCUE_BIN" bs=1M seek=1 conv=notrunc status=none
          [ -f "$REPO_888/factory_orig.bin" ] && dd if="$REPO_888/factory_orig.bin" of="$RESCUE_BIN" bs=1M seek=2 conv=notrunc status=none
          [ -n "$KERNEL_SRC" ] && dd if="$KERNEL_SRC" of="$RESCUE_BIN" bs=1M seek=3 conv=notrunc status=none
          
          echo "✅ rescue-32.bin 合成完毕"

      - name: 8. 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-32m
          path: output/
