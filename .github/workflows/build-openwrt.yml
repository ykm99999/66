name: SL3000-Build-Final-All-Fix

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 888/sl3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential gawk git python3
          sudo timedatectl set-timezone "$TZ"

      - name: Clone source code
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && cp -f $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          # 物理路径修复：去掉 ./ 防止 // 报错
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update & Install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          # 1. 注入你的 3000 行种子配置
          [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          
          # 2. 第一次干预：执行脚本切除冲突零件并锁定架构
          bash $GITHUB_WORKSPACE/$DIY_P2_SH
          
          # 3. 物理自动补全：无交互模式补全缺失零件，忽略递归残余报错
          printf '\n' | make defconfig || true
          
          # 4. 第二次干预：强行改回由于补全导致的 PARTSIZE 变动
          bash $GITHUB_WORKSPACE/$DIY_P2_SH
          
          # 5. 最终物理锁定
          printf '\n' | make oldconfig

      - name: Download package
        run: |
          cd openwrt
          make download -j8

      - name: Compile the firmware
        run: |
          cd openwrt
          # 物理强力构建
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Organize files
        run: |
          cd openwrt/bin/targets/mediatek/filogic/
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: SL3000_32M_Recovery_Firmware
          path: ${{ env.FIRMWARE }}/*nor-programmer-dump.bin
