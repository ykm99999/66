name: Build SL3000 Recovery Firmware

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone Source Code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        # 物理操作：将你仓库中的 config 和脚本拷贝到编译环境
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        # 执行 Makefile 物理锁定脚本
        $GITHUB_WORKSPACE/$DIY_P2_SH
        make defconfig

    - name: Download Package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the Firmware
      run: |
        cd openwrt
        # 【物理路径修复点】：必须使用 uboot-mediatek
        echo "Starting Pre-compile for ATF and U-Boot..."
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
        make package/boot/uboot-mediatek/compile V=s -j1
        
        echo "Starting Global Compilation..."
        make -j$(nproc) || make -j1 V=s

    - name: Organize Files
      if: success()
      run: |
        cd openwrt/bin/targets/mediatek/filogic
        mkdir -p $GITHUB_WORKSPACE/release
        # 物理提取：针对 SL3000 的救砖关键文件
        cp *sl_3000*factory.bin $GITHUB_WORKSPACE/release/ 2>/dev/null || cp *factory.bin $GITHUB_WORKSPACE/release/
        cp *bl2.img $GITHUB_WORKSPACE/release/ 2>/dev/null || true
        cp *u-boot.fip $GITHUB_WORKSPACE/release/ 2>/dev/null || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-DDR4-Recovery-Bundle
        path: release/*
