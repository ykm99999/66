name: SL3000-Recovery-Final-V14

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Actions Repo
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Clone Source
      run: |
        # 物理克隆到底层目录 openwrt
        git clone https://github.com/ykm888/66 -b 2410 openwrt

    - name: Load Config & Physical Apply
      run: |
        cd openwrt
        # --- 核心：物理定位 sl3000.config ---
        if [ -f "sl3000.config" ]; then
            echo "物理校准：定位成功，开始应用配置..."
            # 1. 物理格式化配置
            sed -i 's/\r$//' sl3000.config
            # 2. 物理强制锁定目标架构 (置顶)
            echo "CONFIG_TARGET_mediatek=y" > .config
            echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y" >> .config
            # 3. 合并原始种子配置内容
            cat sl3000.config >> .config
        else
            echo "物理致命错误：在 /workdir/openwrt/ 路径下未找到 sl3000.config！"
            ls -F
            exit 1
        fi
        
        # 执行脚本 (脚本在 openwrt 的父目录)
        chmod +x ../diy-part2.sh
        ../diy-part2.sh
        
        # 物理生成完整编译链
        make defconfig

    - name: Build Toolchain
      run: |
        cd openwrt
        # 必须先物理构建 ARM 工具链，解决 ld-musl 缺失问题
        make tools/install -j$(nproc)
        make toolchain/install -j$(nproc)

    - name: Compile Components
      run: |
        cd openwrt
        echo "物理编译：ATF 零件..."
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
        echo "物理编译：U-Boot 零件..."
        make package/boot/uboot-mediatek/compile V=s -j1
        # 全局编译
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-Recovery-V14
        path: |
          openwrt/bin/targets/mediatek/filogic/*bl2.img
          openwrt/bin/targets/mediatek/filogic/*u-boot.fip
          openwrt/bin/targets/mediatek/filogic/*factory.bin
