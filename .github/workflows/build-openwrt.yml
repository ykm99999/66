name: SL3000 Rescue Bundle Build-v2

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # 像素级补全：添加 m4, flex, bison, ncurses 和构建环境必备工具
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential device-tree-compiler \
          bison flex m4 gawk gettext libncursesw5-dev libncurses5-dev zlib1g-dev \
          python3-setuptools swig python3-dev rsync unzip git qemu-utils

      - name: Prepare Environment (diy-part1)
        run: |
          chmod +x diy-part1.sh
          # 确保 feeds 物理同步完整
          ./diy-part1.sh

      - name: Build and Package (diy-part2)
        env:
          # 彻底解决 "Error opening terminal: unknown"
          TERM: xterm
          FORCE_UNSAFE_CONFIGURE: 1
        run: |
          chmod +x diy-part2.sh
          export GITHUB_WORKSPACE=$GITHUB_WORKSPACE
          ./diy-part2.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-bundle
          path: output/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            output/rescue-32.bin
            output/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
