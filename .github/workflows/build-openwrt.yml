name: SL3000 Rescue Bundle Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-rescue:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main repository (scripts & sources)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential device-tree-compiler

      - name: Build rescue bundle
        run: |
          chmod +x main-repo/diy-part2.sh
          cd main-repo
          ./diy-part2.sh

      - name: List generated files
        run: |
          echo "=== Rescue files ==="
          ls -la output/
          ls -la output/atf/ || true
          ls -la output/uboot/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-bundle
          path: output/

      - name: Create Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SL3000 Rescue ${{ github.ref_name }}"
          body: |
            ## 🔧 救砖全家桶（ATF + U-Boot + mtk_uartboot）
            - 构建时间: ${{ github.ref_name }}
            - 包含可直接用于编程器烧录的 `Spi-flash-32MB.bin`

            ### 📦 文件说明
            - `Spi-flash-32MB.bin` —— **编程器烧录文件（32MB 全镜像）**
            - `atf/` —— ARM 可信固件（BL2/BL31）
            - `uboot/` —— U-Boot 引导程序（eMMC/NOR 版本）
            - `mtk_uartboot.tar.gz` —— 串口救砖工具
          files: |
            output/atf/*.bin
            output/uboot/*.bin
            output/mtk_uartboot.tar.gz
            output/Spi-flash-32MB.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
