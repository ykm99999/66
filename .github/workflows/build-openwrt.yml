name: SL3000 Rescue Build Final

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TERM: xterm
      FORCE_UNSAFE_CONFIGURE: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential device-tree-compiler \
          bison flex m4 gawk gettext libncursesw5-dev libncurses5-dev zlib1g-dev \
          python3-setuptools swig python3-dev rsync unzip git qemu-utils

      - name: Prepare Environment (diy-part1)
        run: |
          chmod +x diy-part1.sh
          ./diy-part1.sh

      - name: Build and Package (diy-part2)
        run: |
          # 物理补丁：强制映射系统 m4 到 OpenWrt 内部路径，彻底解决 flex 调用失败
          mkdir -p immortalwrt/staging_dir/host/bin
          ln -sf $(which m4) immortalwrt/staging_dir/host/bin/m4
          ln -sf $(which flex) immortalwrt/staging_dir/host/bin/flex
          
          chmod +x diy-part2.sh
          export GITHUB_WORKSPACE=$GITHUB_WORKSPACE
          ./diy-part2.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-bundle
          path: output/
