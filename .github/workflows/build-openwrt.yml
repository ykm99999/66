name: SL3000_Manual_Build

# 核心修改：仅手动触发，绝不乱动
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Scripts (main)
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout Source (sl3000-full-sync)
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Initialize Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-aarch64-linux-gnu device-tree-compiler \
            gawk dos2unix libncurses5-dev libssl-dev gettext zlib1g-dev \
            python3 python3-distutils swig flex bison
          
          # 物理清洗脚本格式
          find main-repo/ -name "*.sh" -exec dos2unix {} +
          chmod +x main-repo/*.sh
          
          mkdir -p output/atf output/uboot output/firmware
          sudo chown -R runner:runner .

      - name: Execute V5 Physical Build
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          # 1. 定义物理路径
          WORKSPACE="${{ github.workspace }}"
          SOURCE_DIR="$WORKSPACE/source-repo"
          CONFIG_DIR="$WORKSPACE/main-repo/888"
          OUTPUT_DIR="$WORKSPACE/output"
          IMMORTALWRT_BUILD="$WORKSPACE/immortalwrt-build"
          
          # 2. 物理对齐：提取子目录源码 (根据你提供的仓库结构)
          mkdir -p "$IMMORTALWRT_BUILD"
          if [ -d "$SOURCE_DIR/immortalwrt" ]; then
              cp -r "$SOURCE_DIR/immortalwrt/." "$IMMORTALWRT_BUILD/"
          else
              echo "❌ 物理错误：在分支中未找到 immortalwrt 目录"
              exit 1
          fi
          
          cd "$IMMORTALWRT_BUILD"
          
          # 3. 预解压与物理锁定 (1G/200M/256K)
          ./scripts/feeds update -a && ./scripts/feeds install -a
          make package/boot/uboot-mtk/prepare V=s
          make package/boot/arm-trusted-firmware-mtk/prepare V=s
          
          # 修正串口乱码 (200MHz)
          find package/boot/uboot-mtk/ -name "mt7981.h" -exec sed -i 's/#define CFG_SYS_NS16550_CLK.*/#define CFG_SYS_NS16550_CLK 200000000/g' {} +
          # 修正内存 (1GB)
          find package/boot/arm-trusted-firmware-mtk/ -name "emicfg.c" -exec sed -i 's/return 0x20000000/return 0x40000000/g' {} +
          # 修正偏移 (256K)
          PLAT_DEF=$(find package/boot/arm-trusted-firmware-mtk/ -name "platform_def.h" | head -n 1)
          [ -n "$PLAT_DEF" ] && {
              sed -i '/#define FLASH_FIP_BASE/d' "$PLAT_DEF"
              echo "#define FLASH_FIP_BASE (0x40000)" >> "$PLAT_DEF"
          }

          # 4. 注入用户 Config 并编译
          cp -v "$CONFIG_DIR/mt7981b-sl3000-emmc.dts" target/linux/mediatek/dts/
          cp -v "$CONFIG_DIR/sl3000.config" .config
          make defconfig
          make V=s -j$(nproc)

          # 5. 产物物理抓取
          find bin/targets/mediatek/filogic/ -type f \( -name "*bl2*" -o -name "*fip*" -o -name "*sysupgrade.bin" \) -exec cp -v {} "$OUTPUT_DIR/" \;

      - name: Generate release tag
        id: release_tag
        run: echo "tag_name=v$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 手动构建版 [${{ steps.release_tag.outputs.tag_name }}]"
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
