name: SL3000 Recovery Build

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66.git
  REPO_BRANCH: sl3000-clean-source
  CONFIG_FILE: 888/mt7981_sl3000_nor_defconfig # 你的配置路径
  DIY_P2_SH: diy-part2.sh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Action Repo
      uses: actions/checkout@v4

    - name: Prepare Environment
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Clone Source Code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Load Custom Configuration
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config

    - name: Execute Physical Alignment (DIY Part 2)
      run: |
        chmod +x $DIY_P2_SH
        ./$DIY_P2_SH

    - name: Download Packages
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j8

    - name: Compile Firmware
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/checkout@v4
      with:
        name: SL3000-Recovery-Firmware
        path: openwrt/bin/targets/mediatek/filogic/
