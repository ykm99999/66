name: SL3000-Physical-Recovery-Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Master Repo
        uses: actions/checkout@v4
        with:
          path: master-repo  # 将主控仓库放在独立目录

      - name: Clone Source Code
        run: |
          # 克隆底层源码仓库 2410 分支
          git clone --depth 1 https://github.com/ykm888/66.git -b 2410 openwrt

      - name: Physical Move Assets
        run: |
          # 1. 搬运配置文件 (严格遵守不自动创建逻辑)
          cp master-repo/888/sl3000.config openwrt/.config
          # 2. 搬运脚本到根目录以便执行
          cp master-repo/diy-part2.sh .
          chmod +x diy-part2.sh

      - name: Execute Physical Alignment
        run: |
          # 运行自愈脚本，内部会自动进入 openwrt 目录
          ./diy-part2.sh

      - name: Run defconfig
        working-directory: ./openwrt
        run: |
          # 物理锁定：将种子 config 展开为完整配置
          make defconfig

      - name: Compile Firmware
        working-directory: ./openwrt
        run: |
          # 执行物理编译
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-Recovery-Image
          path: openwrt/bin/targets/mediatek/filogic/*.bin
