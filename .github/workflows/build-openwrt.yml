name: SL3000-旗舰固件生产线-V23-Final

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410
  CONFIG_FILE: 888/sl3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

jobs:
  build_firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: 物理检出本地仓库
        uses: actions/checkout@v4

      - name: 部署工业级编译环境
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential gawk git python3 curl
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: 源码克隆与 Feeds 同步
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 执行物理架构强攻与截肢 (diy-part2)
        run: |
          chmod +x $DIY_P2_SH
          cd openwrt && ../$DIY_P2_SH

      - name: 加载已捕获的物理种子
        run: |
          cp $CONFIG_FILE openwrt/.config

      - name: 执行插件补全与分区锁定 (diy-part1)
        run: |
          chmod +x $DIY_P1_SH
          cd openwrt && ../$DIY_P1_SH
          # 执行原子化依赖补全
          make defconfig

      - name: 预下载依赖包 (Download)
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 生产级全量编译 (Compile)
        run: |
          cd openwrt
          # 物理隔离：先用多线程，失败则自动切换单线程展示错误
          make -j$(nproc) || make -j1 V=s

      - name: 物理提取产物
        run: |
          mkdir -p ./output
          cp openwrt/bin/targets/mediatek/filogic/*.bin ./output/ 2>/dev/null || echo "未找到 bin 文件"
          echo "BUILD_TIME=$(date +'%Y%m%d_%H%M')" >> $GITHUB_ENV

      - name: 发布 SL3000 救砖固件
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-eMMC-V23-${{ env.BUILD_TIME }}
          path: ./output/
