name: SL-3000 Recovery Build 24.10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 物理检出
        uses: actions/checkout@v4

      - name: 环境筑基
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gawk libncurses5-dev gettext libssl-dev xsltproc wget zstd
          git clone -b openwrt-24.10 --depth 1 https://github.com/immortalwrt/immortalwrt openwrt
          cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 零件注入
        run: |
          chmod +x diy-part2.sh
          cd openwrt
          ../diy-part2.sh

      - name: 工具链编译 (物理硬化)
        run: |
          cd openwrt
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 救砖固件合成
        run: |
          cd openwrt
          # 优先编译救砖版 ATF
          make package/boot/arm-trusted-firmware-mediatek/compile V=s
          # 编译救砖版 U-Boot
          make package/boot/uboot-mediatek/compile V=s
          # 生成最终镜像
          make target/linux/mediatek/image/compile V=s

      - name: 上传物理产物
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-NOR-Recovery
          path: openwrt/bin/targets/mediatek/filogic/*
