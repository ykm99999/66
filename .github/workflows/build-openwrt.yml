name: SL3000-Physical-Final-Solution

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 888/sl3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential gawk git python3
          sudo timedatectl set-timezone "$TZ"

      - name: Clone source code
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && cp -f $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update & Install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          # 步骤 A: 物理注入种子配置
          [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          
          # 步骤 B: 第一次脚本执行 (切除 rd05a1 癌细胞，防止 defconfig 崩溃)
          bash $GITHUB_WORKSPACE/$DIY_P2_SH
          
          # 步骤 C: 彻底消除交互 (使用 sh -c 配合默认应答)
          # 这一步会自动补全 3000 行配置中缺失的所有新选项
          make defconfig
          
          # 步骤 D: 第二次脚本执行 (强制物理回滚)
          # 确保 defconfig 补全过程中没把 Target 架构和 20MB 分区表改掉
          bash $GITHUB_WORKSPACE/$DIY_P2_SH
          
          # 步骤 E: 物理锁定
          make oldconfig

      - name: Download package
        run: |
          cd openwrt
          make download -j8

      - name: Compile the firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Organize files
        run: |
          cd openwrt/bin/targets/mediatek/filogic/
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload firmware to Release
        uses: softprops/action-gh-release@v2
        if: (!cancelled())
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.FIRMWARE }}/*nor-programmer-dump.bin
          name: SL3000-32M-Final-Recovery
          tag_name: SL3000_v1.0
