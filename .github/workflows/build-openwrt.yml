name: SL3000-Recovery-V15-Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Actions Repo
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Clone Source
      run: |
        # 物理克隆：源码及 sl3000.config 均进入 openwrt 目录
        git clone https://github.com/ykm888/66 -b 2410 openwrt

    - name: Load Config & Physical Force-Apply
      run: |
        cd openwrt
        # --- 物理修正：在当前 openwrt 目录下寻找 sl3000.config ---
        if [ -f "sl3000.config" ]; then
            echo "物理校准：已定位到 sl3000.config"
            # 1. 清理换行符污染
            sed -i 's/\r$//' sl3000.config
            # 2. 物理重置 .config 并强行注入 ARM 架构标识
            # 使用 > 符号彻底抹除旧的 x86 记忆
            echo "CONFIG_TARGET_mediatek=y" > .config
            echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y" >> .config
            # 3. 追加你原有的种子配置
            cat sl3000.config >> .config
        else
            echo "物理致命错误：sl3000.config 不在 openwrt 目录中！"
            ls -F # 列出当前目录供回溯
            exit 1
        fi
        
        # 4. 执行零件对齐脚本 (脚本在 openwrt 的父目录)
        chmod +x ../diy-part2.sh
        ../diy-part2.sh
        
        # 5. 物理生成全量编译配置
        make defconfig

    - name: Build Toolchain
      run: |
        cd openwrt
        # 必须先构建 ARM 交叉编译环境，防止 cp ld-musl 报错
        make tools/install -j$(nproc)
        make toolchain/install -j$(nproc)

    - name: Compile
      run: |
        cd openwrt
        # 精准物理编译引导零件
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
        make package/boot/uboot-mediatek/compile V=s -j1
        # 全局编译 (如果熔断，开启单核日志模式)
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-V15-Recovery-Bin
        path: openwrt/bin/targets/mediatek/filogic/*
