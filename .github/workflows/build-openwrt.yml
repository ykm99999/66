name: SL3000-Physical-Recovery-V2026

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: 2410
  CONFIG_FILE: sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone Source
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Config & Physical Reset
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        # 物理注入 SL3000 定义
        $GITHUB_WORKSPACE/$DIY_P2_SH
        
        # --- 物理架构重置 (彻底解决 x86 残留) ---
        rm -rf staging_dir/target-x86_64* build_dir/target-x86_64*
        rm -rf staging_dir/toolchain-x86_64* build_dir/toolchain-x86_64*
        
        # 强制同步配置
        make defconfig

    - name: Compile Toolchain (Physics First)
      run: |
        cd openwrt
        echo "物理构建：AArch64 工具链..."
        make tools/install -j$(nproc) || make tools/install -j1 V=s
        make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

    - name: Compile SL3000 Components
      run: |
        cd openwrt
        echo "物理构建：ATF & U-Boot..."
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
        make package/boot/uboot-mediatek/compile V=s -j1

    - name: Final Global Build
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Organize Artifacts
      run: |
        cd openwrt/bin/targets/mediatek/filogic
        mkdir -p $GITHUB_WORKSPACE/release
        # 物理提取救砖零件
        cp *sl_3000* $GITHUB_WORKSPACE/release/ || true
        cp *bl2.img $GITHUB_WORKSPACE/release/ || true
        cp *u-boot.fip $GITHUB_WORKSPACE/release/ || true

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-Final-Recovery
        path: release/*
