name: Build SL3000 Recovery Firmware (2410 Branch)

on:
  workflow_dispatch:

env:
  # 物理锁定：你的个人源码库
  REPO_URL: https://github.com/ykm888/66
  # 物理锁定：你手动改好 DTS/MK 的分支
  REPO_BRANCH: 2410
  CONFIG_FILE: sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Actions Repo
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone Your Custom Source
      working-directory: /workdir
      run: |
        # 物理操作：直接克隆 2410 分支，确保 DTS 和 MK 无缝接入
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        # 注入种子配置
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        # 物理注入：强行锁定 ATF/U-Boot 为 DDR4 私有源
        $GITHUB_WORKSPACE/$DIY_P2_SH
        make defconfig

    - name: Download Package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the Firmware
      run: |
        cd openwrt
        # 物理锁定路径：uboot-mediatek
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
        make package/boot/uboot-mediatek/compile V=s -j1
        
        make -j$(nproc) || make -j1 V=s

    - name: Organize Files
      if: success()
      run: |
        cd openwrt/bin/targets/mediatek/filogic
        mkdir -p $GITHUB_WORKSPACE/release
        cp *factory.bin $GITHUB_WORKSPACE/release/ 2>/dev/null || true
        cp *bl2.img $GITHUB_WORKSPACE/release/ 2>/dev/null || true
        cp *u-boot.fip $GITHUB_WORKSPACE/release/ 2>/dev/null || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-Recovery-Bundle-2410
        path: release/*
