name: SL3000-物理救砖-终极构建

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: 2410
  CONFIG_FILE: 888/sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Control Repo
      uses: actions/checkout@main

    - name: Initialization Environment
      run: |
        sudo -E apt-get -qq update
        # 物理拒绝安装 ccache，确保环境纯净
        sudo -E apt-get -qq install build-essential clang flex bison gawk gettext git libncurses5-dev libssl-dev python3-distutils python3-pyelftools zlib1g-dev xxd m4
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone OpenWrt Source
      working-directory: /workdir
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install Feeds
      run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

    - name: Load Config & Execute DIY-P2
      run: |
        # 1. 搬运已经修复好的 888/sl3000.config
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        # 2. 执行物理级净化与平铺脚本
        chmod +x $DIY_P2_SH
        ./$DIY_P2_SH
        # 3. 物理刷新 Makefile 依赖
        cd openwrt && ./scripts/feeds install -a

    - name: Download & Defconfig
      run: |
        cd openwrt
        # 重新生成配置，彻底物理抹除 CCACHE 影子
        make defconfig
        make download -j8

    - name: Compile Firmware
      run: |
        cd openwrt
        # 物理执行：先编译内核，再整体并行构建
        make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s
        make -j$(nproc) || make -j1 V=s

    - name: Organize & Upload Bin
      if: always()
      run: |
        mkdir -p ./output
        # 提取 eMMC 救砖专用的 factory.bin 和 sysupgrade.bin
        cp openwrt/bin/targets/mediatek/filogic/*.bin ./output/ || echo "No Images Found"
      
    - name: Upload Artifact
      uses: actions/upload-artifact@main
      with:
        name: SL3000-Recovery-Firmware
        path: ./output/*.bin
