name: SL3000 Rescue Firmware Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout source repository (submodules)
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo
          submodules: recursive

      - name: Generate release tag
        id: release_tag
        run: |
          TAG_NAME="v$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG_NAME"

      - name: Install host dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Optimize disk space
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Run diy-part1.sh
        working-directory: main-repo
        run: |
          chmod +x diy-part1.sh
          ./diy-part1.sh

      - name: Run diy-part2.sh
        working-directory: main-repo
        run: |
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: List generated files
        run: |
          echo "=== Rescue files ==="
          find output/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 Firmware ${{ steps.release_tag.outputs.tag_name }}"
          body: |
            ## 🚀 自动构建的 SL3000 救砖全家桶
            - 构建时间: ${{ steps.release_tag.outputs.tag_name }}
            - 包含 ATF/BL2 (eMMC/NOR/RAM)、U-Boot、FIP、完整 sysupgrade 固件、mtk_uartboot

            ### 📦 使用说明
            - `firmware/` 目录包含 sysupgrade 固件，可直接刷入
            - `atf/` 和 `uboot/` 目录提供救砖用 BL2/FIP
            - `mtk_uartboot.tar.gz` 为串口刷机工具包
          files: |
            output/atf/*
            output/uboot/*
            output/firmware/*
            output/mtk_uartboot.tar.gz

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-${{ steps.release_tag.outputs.tag_name }}
          path: output/
