name: SL3000-V1-Physical-Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Actions Repo
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Clone OpenWrt Source
      run: |
        # 物理克隆 ykm888/66 的 2410 分支
        git clone --depth 1 https://github.com/ykm888/66 -b 2410 openwrt

    - name: Load Config & Force Apply
      run: |
        # --- 物理路径锁定：从 888 目录抓取种子 ---
        if [ -f "888/sl3000.config" ]; then
            echo "物理校准：已定位到 888/sl3000.config"
            
            # 1. 物理清洗换行符
            sed -i 's/\r$//' 888/sl3000.config
            
            # 2. 物理强制注入核心架构 (单箭头覆盖旧配置)
            echo "CONFIG_TARGET_mediatek=y" > openwrt/.config
            echo "CONFIG_TARGET_mediatek_filogic=y" >> openwrt/.config
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_sl_3000-emmc=y" >> openwrt/.config
            
            # 3. 追加 888 目录下的业务配置
            cat 888/sl3000.config >> openwrt/.config
            echo "物理注入完成：888种子已对齐到 openwrt/.config"
        else
            echo "物理致命错误：888/sl3000.config 不在预期位置！"
            ls -R
            exit 1
        fi

    - name: Run DIY Scripts
      run: |
        # 脚本必须在根目录执行，内部会 cd openwrt
        chmod +x diy-part2.sh
        ./diy-part2.sh

    - name: Build Toolchain
      run: |
        cd openwrt
        make defconfig
        make tools/install -j$(nproc)
        make toolchain/install -j$(nproc)

    - name: Compile Components
      run: |
        cd openwrt
        # 物理精准打击救砖零件
        make package/boot/arm-trusted-firmware-mediatek/compile V=s -j1
        make package/boot/uboot-mediatek/compile V=s -j1
        # 开始全局编译
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-V1-Recovery-Package
        path: openwrt/bin/targets/mediatek/filogic/*
