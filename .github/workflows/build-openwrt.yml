name: SL3000_Rescue_Build_V3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Scripts
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-aarch64-linux-gnu device-tree-compiler \
            gawk dos2unix libncurses5-dev libssl-dev gettext zlib1g-dev \
            python3 python3-distutils swig flex bison
          
          # 物理清洗：修复脚本格式
          find main-repo/ -name "*.sh" -exec dos2unix {} +
          chmod +x main-repo/*.sh

      - name: Execute Integrated Build
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          # 像素级执行：在同一个 step 中完成所有逻辑，防止路径丢失
          ./main-repo/build_sl3000.sh

      - name: Generate release tag
        id: release_tag
        run: echo "tag_name=v$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 V2 物理救砖固件 (1G/200M/256K)"
          files: |
            output/firmware/*
            output/atf/*
            output/uboot/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
