name: 一键修复并构建固件

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  # 注入终端信息，防止 ncurses 报错，解决 Error opening terminal: unknown
  TERM: xterm
  TERMINFO: /usr/share/terminfo

jobs:
  repair_and_build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 环境初始化与克隆分支
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3
          # 原文照抄：检出 openwrt-24.10-6.6 框架
          git clone -b openwrt-24.10-6.6 https://github.com/immortalwrt/immortalwrt immortalwrt-build

      - name: 更新与安装 Feeds
        working-directory: ./immortalwrt-build
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 物理修复：配置注入 (取代 menuconfig)
        working-directory: ./immortalwrt-build
        run: |
          # 修复点：从远程分支下载 config，而非交互式生成
          wget https://raw.githubusercontent.com/ykm888/66/main/custom-config/sl3000.config -O .config
          # 使用 defconfig 物理展开配置，避免触发交互式 mconf
          make defconfig

      - name: 修正底层 Bootloader 物理参数
        working-directory: ./immortalwrt-build
        run: |
          # 修复点：增加路径存在性校验，防止 find 报错
          UBOOT_PATH="package/boot/uboot-mtk"
          if [ ! -d "$UBOOT_PATH" ]; then
            # 如果路径不一致，尝试寻找包含 mtk/mediatek 的相似目录
            UBOOT_PATH=$(find package/boot/ -maxdepth 1 -name "*mediatek*" -o -name "*mtk*" | head -n 1)
          fi
          
          if [ -z "$UBOOT_PATH" ]; then
            echo "Error: 找不到 Bootloader 源码目录，请检查 Feeds 是否安装成功。"
            exit 1
          fi

          echo "目标路径已锁定: $UBOOT_PATH"
          # 在此处执行具体的 DTS 或 Makefile 修改逻辑（延续 1 版逻辑）
          # sed -i 's/OLD/NEW/g' $UBOOT_PATH/Makefile 

      - name: 编译固件
        working-directory: ./immortalwrt-build
        run: |
          # 静默审计确认：不再调用 menuconfig，直接执行编译
          make -j$(nproc) || make -j1 V=s
