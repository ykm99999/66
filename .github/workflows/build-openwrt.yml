name: SL3000_Rescue_Build_V1

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main branch (Scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout source branch (Base Source)
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Generate release tag
        id: release_tag
        run: |
          TAG_NAME="v$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Install cross-compilation tools
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Optimize disk & Fix IO permissions
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo chown -R runner:runner $GITHUB_WORKSPACE
          df -h

      - name: Run diy-part1.sh
        run: |
          chmod +x main-repo/diy-part1.sh
          ./main-repo/diy-part1.sh

      - name: Run diy-part2.sh
        run: |
          chmod +x main-repo/diy-part2.sh
          ./main-repo/diy-part2.sh

      - name: List All Artifacts
        run: |
          echo "=== 1版物理合成清单 ==="
          find output/ -maxdepth 3 -not -path '*/.*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 救砖全家桶 V1 [${{ steps.release_tag.outputs.tag_name }}]"
          body: |
            ## 🚀 SL3000 1版物理修复固件 (V1)
            本固件基于 1GB DDR4 硬件规格进行物理全链路溯源构建。

            ### 📦 核心产物
            - **SL3000_SPI_RESCUE_V1.bin**: 32MB 完整救砖包。
            - **bl2-ram-1g.bin**: 串口加载文件。
            
            ### 🔧 救砖指南
            1. 物理刷入 V1.bin。
            2. 串口波特率 115200，上电有 9 秒拦截窗口。
            3. 执行 `mmc erase 0 0x800` 清理 eMMC 冲突。
          files: |
            output/firmware/SL3000_SPI_RESCUE_V1.bin
            output/firmware/*sysupgrade.bin
            output/atf/bl2-ram-1g.bin
            output/atf/bl2-1g-nor.bin
            output/uboot/fip-nor.bin
            output/mtk_uartboot.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
