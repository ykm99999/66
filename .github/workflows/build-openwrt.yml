name: SL3000 Separate Build (Rescue + eMMC)

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build-rescue:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Generate release tag
        id: release_tag
        run: |
          TAG_NAME="v$(date -u +'%Y%m%d-%H%M%S')-rescue"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG_NAME"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Optimize disk space
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Run diy-part1-rescue.sh
        run: |
          chmod +x main-repo/diy-part1-rescue.sh
          cd main-repo
          ./diy-part1-rescue.sh

      - name: Run diy-part2.sh
        run: |
          chmod +x main-repo/diy-part2.sh
          cd main-repo
          ./diy-part2.sh

      - name: List firmware files
        run: |
          echo "=== Rescue build output ==="
          ls -la output/atf/ output/uboot/ output/firmware/ || true

      - name: Create Rescue Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 Rescue Firmware ${{ steps.release_tag.outputs.tag_name }}"
          body: |
            ## 救砖全家桶（SPI‑NOR 32MB）
            - 镜像大小: ~10.65 MB
            - 包含 ATF, U-Boot, mtk_uartboot
          files: |
            output/atf/*.bin
            output/atf/*.elf
            output/uboot/*.bin
            output/firmware/Spi-flash-32MB.bin
            output/mtk_uartboot.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload rescue artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-${{ steps.release_tag.outputs.tag_name }}
          path: output/

  build-emmc:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Generate release tag
        id: release_tag
        run: |
          TAG_NAME="v$(date -u +'%Y%m%d-%H%M%S')-emmc"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG_NAME"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Optimize disk space
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Run diy-part1-emmc.sh
        run: |
          chmod +x main-repo/diy-part1-emmc.sh
          cd main-repo
          ./diy-part1-emmc.sh

      - name: Run diy-part2.sh
        run: |
          chmod +x main-repo/diy-part2.sh
          cd main-repo
          ./diy-part2.sh

      - name: List firmware files
        run: |
          echo "=== eMMC build output ==="
          ls -la output/atf/ output/uboot/ output/firmware/ || true

      - name: Create eMMC Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 eMMC Firmware ${{ steps.release_tag.outputs.tag_name }}"
          body: |
            ## eMMC 升级固件（完整版）
            - 包含科学上网、Docker、LuCI 等
            - 大小: ~118 MB
          files: |
            output/atf/*.bin
            output/atf/*.elf
            output/uboot/*.bin
            output/firmware/*.bin
            output/mtk_uartboot.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload eMMC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-emmc-${{ steps.release_tag.outputs.tag_name }}
          path: output/
