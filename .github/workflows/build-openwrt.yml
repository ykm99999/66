name: Build SL3000 Rescue Firmware

on:
  push:
    branches: [ main ]
    paths:
      - '888/**'
      - '.github/workflows/build-rescue.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup environment
        run: |
          echo "WORKSPACE=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "OUTPUT_DIR=$GITHUB_WORKSPACE/output" >> $GITHUB_ENV
          echo "CONFIG_DIR=$GITHUB_WORKSPACE/888" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
              gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
              python3 python3-distutils python3-setuptools rsync swig unzip \
              zlib1g-dev file wget cpio libelf-dev quilt gperf time \
              libncurses5-dev

      - name: Ensure /bin/sh points to bash
        run: |
          sudo ln -sf /bin/bash /bin/sh
          echo "Default shell now: $(readlink /bin/sh)"

      - name: Verify required files in 888/
        run: |
          cd $CONFIG_DIR
          missing=0
          for f in sl3000.config mt7981b-sl3000-emmc.dts mt7981_sl3000.mk \
                   bl2_orig.bin fip_orig.bin factory_orig.bin; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: 888/$f"
              missing=1
            fi
          done
          if [ $missing -eq 1 ]; then
            echo "::error::Please ensure all required files are present in 888/ directory."
            exit 1
          fi
          echo "All required files found."

      - name: Prepare OpenWrt source
        run: |
          cd $GITHUB_WORKSPACE
          OWRT_DIR="immortalwrt"
          if [ -d "$OWRT_DIR" ]; then
            if [ -d "$OWRT_DIR/.git" ]; then
              echo "OpenWrt source already exists as a Git repository, skipping clone."
            else
              echo "Directory $OWRT_DIR exists but is not a Git repository. Removing and re-cloning..."
              rm -rf "$OWRT_DIR"
              git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git "$OWRT_DIR"
            fi
          else
            echo "Cloning ImmortalWrt repository..."
            git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git "$OWRT_DIR"
          fi

      - name: Apply device configuration
        run: |
          cd $GITHUB_WORKSPACE/immortalwrt
          cp $CONFIG_DIR/sl3000.config .config
          cp $CONFIG_DIR/mt7981b-sl3000-emmc.dts target/linux/mediatek/dts/
          cp $CONFIG_DIR/mt7981_sl3000.mk target/linux/mediatek/image/filogic.mk

      - name: Verify only SL3000 device is selected
        run: |
          cd $GITHUB_WORKSPACE/immortalwrt
          export CONFIG_SHELL=/bin/bash
          make defconfig
          if grep -q "^CONFIG_TARGET_mediatek_filogic_DEVICE_.*=y" .config | grep -v "mt7981_sl3000_spi_rescue"; then
            echo "::error::Other Filogic devices are still selected in .config!"
            exit 1
          fi
          echo "✅ Only SL3000 device selected."

      - name: Update feeds
        run: |
          cd $GITHUB_WORKSPACE/immortalwrt
          export CONFIG_SHELL=/bin/bash
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build OpenWrt (kernel + rootfs)
        run: |
          cd $GITHUB_WORKSPACE/immortalwrt
          export CONFIG_SHELL=/bin/bash
          make -j$(nproc) V=s

      - name: Locate and copy sysupgrade.itb
        run: |
          cd $GITHUB_WORKSPACE/immortalwrt
          ITB_FILE=$(find bin/targets/mediatek/filogic -name "*-sysupgrade.itb" | head -1)
          if [ -z "$ITB_FILE" ]; then
            echo "::error::sysupgrade.itb not found! Build may have failed."
            exit 1
          fi
          mkdir -p $OUTPUT_DIR
          cp "$ITB_FILE" $OUTPUT_DIR/sysupgrade.itb
          echo "Kernel image copied to $OUTPUT_DIR/sysupgrade.itb"

      - name: Assemble final 32MB rescue firmware
        run: |
          cd $OUTPUT_DIR
          FINAL_BIN="sl3000-rescue-32mb.bin"

          cp $CONFIG_DIR/bl2_orig.bin bl2-emmc-ddr3.bin
          cp $CONFIG_DIR/fip_orig.bin bl31-uboot-emmc-ddr3.fip
          cp $CONFIG_DIR/factory_orig.bin factory_orig.bin

          dd if=/dev/zero bs=1M count=32 | tr '\000' '\377' > $FINAL_BIN

          echo "Writing BL2 @ 0M"
          dd if=bl2-emmc-ddr3.bin of=$FINAL_BIN conv=notrunc status=none

          echo "Writing FIP @ 1M"
          dd if=bl31-uboot-emmc-ddr3.fip of=$FINAL_BIN bs=1M seek=1 conv=notrunc status=none

          echo "Writing Factory @ 2M"
          dd if=factory_orig.bin of=$FINAL_BIN bs=1M seek=2 conv=notrunc status=none

          echo "Writing Kernel @ 3M"
          dd if=sysupgrade.itb of=$FINAL_BIN bs=1M seek=3 conv=notrunc status=none

          echo "✅ Firmware assembled: $OUTPUT_DIR/$FINAL_BIN"
          ls -lh $FINAL_BIN

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-firmware
          path: output/sl3000-rescue-32mb.bin

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            immortalwrt/logs/
            immortalwrt/build_dir/
          if-no-files-found: ignore
