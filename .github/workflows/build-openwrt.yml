name: SL3000-救砖版-物理环境修复编译

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: 2410
  CONFIG_FILE: 888/sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Master Repo
      uses: actions/checkout@main

    - name: Initialization Environment
      run: |
        sudo -E apt-get -qq update
        # 物理级补全：m4, flex, bison, python3-pyelftools 是解决内核编译失败的关键
        sudo -E apt-get -qq install build-essential clang flex bison gawk gettext git libncurses5-dev libssl-dev python3-distutils python3-pyelftools zlib1g-dev xxd ccache m4
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone Source Code
      working-directory: /workdir
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install Feeds
      run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

    - name: Load Config & Apply DIY-P2
      run: |
        # 物理搬运种子配置
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        ./$DIY_P2_SH
        # 强制安装刷新 Makefile 逻辑
        cd openwrt && ./scripts/feeds install -a

    - name: Download & Defconfig
      run: |
        cd openwrt
        # 重新生成配置以彻底应用脚本中的 sed 修改
        make defconfig
        make download -j8

    - name: Compile Firmware
      run: |
        cd openwrt
        # 物理编译策略：单线程编译内核以便观察报错，整体并行编译
        make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s
        make -j$(nproc) || make -j1 V=s

    - name: Organize & Upload
      if: always()
      run: |
        mkdir -p ./output
        cp openwrt/bin/targets/mediatek/filogic/*.bin ./output/ || echo "No bin files found"
      
    - name: Upload Artifact
      uses: actions/upload-artifact@main
      with:
        name: SL3000-EMMC-Fixed-Build
        path: ./output/*.bin
