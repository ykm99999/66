name: Build SL3000 Rescue Image (Manual Trigger)

on:
  workflow_dispatch:          # 仅允许手动触发
    inputs:
      clean_build:
        description: 'Perform a clean build (clear caches)'
        required: false
        type: boolean
        default: false

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      # ------------------------------------------------------------
      # 1. 检出主仓库（包含 888/ 配置目录和两个脚本）
      # ------------------------------------------------------------
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: main-repo

      # ------------------------------------------------------------
      # 2. 创建源码目录（source-repo）供脚本克隆使用
      # ------------------------------------------------------------
      - name: Prepare source directory
        run: mkdir -p source-repo

      # ------------------------------------------------------------
      # 3. 安装编译依赖
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3 python3-setuptools rsync swig unzip zlib1g-dev \
          file wget cpio gdisk device-tree-compiler

      # ------------------------------------------------------------
      # 4. 设置工具链（aarch64）
      # ------------------------------------------------------------
      - name: Setup cross-compilation toolchain
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # 5. 执行 diy-part1.sh（环境准备与源码克隆）
      # ------------------------------------------------------------
      - name: Run diy-part1.sh
        run: |
          chmod +x main-repo/diy-part1.sh
          cd main-repo
          ./diy-part1.sh

      # ------------------------------------------------------------
      # 6. 执行 diy-part2.sh（编译与组装镜像）
      # ------------------------------------------------------------
      - name: Run diy-part2.sh
        run: |
          chmod +x main-repo/diy-part2.sh
          cd main-repo
          ./diy-part2.sh

      # ------------------------------------------------------------
      # 7. 整理并上传构建产物
      # ------------------------------------------------------------
      - name: Collect artifacts
        run: |
          mkdir -p upload
          cp -r main-repo/output/* upload/ 2>/dev/null || true
          # 生成文件列表
          ls -lah upload/ > upload/filelist.txt

      - name: Upload rescue artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-spi-full
          path: upload/
          retention-days: 30
