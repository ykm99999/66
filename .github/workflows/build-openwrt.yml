name: SL3000-救砖版-物理终结编译

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66
  REPO_BRANCH: 2410
  CONFIG_FILE: 888/sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Control Repo
      uses: actions/checkout@main

    - name: Initialization Environment
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex gawk gettext git libncurses5-dev libssl-dev python3-distutils zlib1g-dev xxd
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone Source Code
      working-directory: /workdir
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install Feeds
      run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

    - name: Load Config & Apply DIY-P2
      run: |
        # 1. 物理搬运种子配置到 openwrt 根目录
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        # 2. 执行脚本：物理平铺子目录并补全 ID
        chmod +x $DIY_P2_SH
        ./$DIY_P2_SH
        # 3. 再次强制安装以刷新 Makefile 修改
        cd openwrt && ./scripts/feeds install -a

    - name: Download & Defconfig
      run: |
        cd openwrt
        make defconfig
        make download -j8

    - name: Compile Firmware
      run: |
        cd openwrt
        # 物理策略：先内核后整体
        make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s
        make -j$(nproc) || make -j1 V=s

    - name: Organize & Upload
      if: always()
      run: |
        mkdir -p ./output
        cp openwrt/bin/targets/mediatek/filogic/*.bin ./output/ || echo "No bin files"
      
    - name: Upload Artifact
      uses: actions/upload-artifact@main
      with:
        name: SL3000-Final-EMMC-Firmware
        path: ./output/*.bin
