name: 司洛SL-3000 EMMC 路径修复版

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 888/sl3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential gawk git python3
          sudo timedatectl set-timezone "$TZ"

      - name: Clone source code
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && cp -f $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          # 物理执行：工序 1-3
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update & Install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          # 彻底解决：先补全，再执行 diy-part2.sh 覆盖分区表
          make defconfig
          bash $GITHUB_WORKSPACE/$DIY_P2_SH
          make oldconfig

      - name: Download package
        run: |
          cd openwrt
          make download -j8

      - name: Compile the firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Organize files
        run: |
          cd openwrt/bin/targets/*/*
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: SL3000_Firmware
          path: ${{ env.FIRMWARE }}/*nor-programmer-dump.bin
