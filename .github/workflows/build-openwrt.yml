name: Build SL3000 Rescue Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          flex bison gawk git libncurses5-dev libssl-dev python3 python3-setuptools \
          unzip wget cpio gdisk device-tree-compiler

      - name: Run diy-part1.sh
        run: |
          chmod +x diy-part1.sh
          ./diy-part1.sh

      - name: Run diy-part2.sh
        run: |
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-images
          path: output/
