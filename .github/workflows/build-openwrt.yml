name: Build Rescue Package

# 来自知识库[3][7]：在 .github/workflows/ 目录下创建
on:
  push:
    branches: [ main ]
    # 只有当关键文件变化时才触发，避免不必要的构建
    paths:
      - 'mtk_uartboot/**'
      - 'immortalwrt/**'
      - 'u-boot/**'
      - 'arm-trusted-firmware/**'
      - '888/**'
      - 'build_rescue.sh'
  workflow_dispatch: # 允许手动触发，方便调试

jobs:
  build-rescue:
    runs-on: ubuntu-latest
    name: Generate Rescue Bin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # 确保获取完整的 git history，对某些构建可能有用

      - name: Setup Environment
        run: |
          # 安装构建所需的基本工具
          sudo apt-get update
          sudo apt-get install -y python3 build-essential device-tree-compiler libssl-dev wget git xz-utils rsync bc

      - name: Run Build Script
        # 来自知识库[1][8]：设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
        # 然后运行我们的主脚本
        run: |
          chmod +x build_rescue.sh
          ./build_rescue.sh

      - name: Upload Artifact
        # 来自知识库[1][8]：上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: rescue-package-${{ github.run_number }}
          path: output/
          retention-days: 7

      - name: Create Release (Optional)
        # 可选：如果想为每次成功构建创建一个Release，可以取消注释以下代码
        # uses: ncipollo/release-action@v1
        # with:
        #   artifacts: "output/*"
        #   token: ${{ secrets.GITHUB_TOKEN }}
