name: SL3000 Full Image Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Optimize disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Run diy-part1.sh (Prepare OpenWrt)
        run: |
          chmod +x main-repo/diy-part1.sh
          cd main-repo
          ./diy-part1.sh

      - name: Run diy-part2.sh (Build All & Create Full Image)
        run: |
          chmod +x main-repo/diy-part2.sh
          cd main-repo
          ./diy-part2.sh
        timeout-minutes: 360

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-full-image
          path: output/

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SL3000 Full Image ${{ github.ref_name }}"
          files: |
            output/atf/*.bin
            output/uboot/*.bin
            output/firmware/*.bin
            output/mtk_uartboot.tar.gz
            output/Spi-flash-32MB-full.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
