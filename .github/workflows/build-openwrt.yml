name: SL3000 Rescue Build (Only SPI‑NOR)

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build-rescue:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout own repository (contains all source code)
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Prepare source-repo (symlink to directories inside main-repo)
        run: |
          mkdir -p source-repo
          # 将主仓库中的源码目录软链接到 source-repo 下（脚本期望的位置）
          ln -sf $PWD/main-repo/arm-trusted-firmware source-repo/
          ln -sf $PWD/main-repo/u-boot source-repo/
          ln -sf $PWD/main-repo/immortalwrt source-repo/
          ln -sf $PWD/main-repo/mtk_uartboot source-repo/
          # 如果有其他需要的目录，也添加
          ls -la source-repo/

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Run diy-part1.sh
        run: |
          chmod +x main-repo/diy-part1.sh
          cd main-repo
          ./diy-part1.sh

      - name: Run diy-part2.sh
        run: |
          chmod +x main-repo/diy-part2.sh
          cd main-repo
          ./diy-part2.sh

      - name: List firmware files
        run: |
          echo "=== Rescue build output ==="
          ls -la output/atf/ output/uboot/ output/firmware/ || true

      - name: Generate release tag
        id: release_tag
        run: |
          TAG_NAME="v$(date -u +'%Y%m%d-%H%M%S')-rescue"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG_NAME"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 Rescue Firmware ${{ steps.release_tag.outputs.tag_name }}"
          body: |
            ## 救砖全家桶（SPI‑NOR 32MB）
            - 完整镜像 `SL3000-full-spi-nor-32mb.bin`（可直接烧录到 SPI-NOR）
            - 单独文件：`bl2-1g-nor.bin`、`fip-nor.bin`、`Spi-flash-32MB.bin`
            - 工具包：`mtk_uartboot.tar.gz`
          files: |
            output/atf/*.bin
            output/atf/*.elf
            output/uboot/*.bin
            output/firmware/Spi-flash-32MB.bin
            output/firmware/SL3000-full-spi-nor-32mb.bin
            output/mtk_uartboot.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-${{ steps.release_tag.outputs.tag_name }}
          path: output/
