name: SL3000 Final Build with Auto Release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Generate release tag
        id: release_tag
        run: |
          TAG_NAME="v$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG_NAME"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Optimize disk space
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      # ---------- 新增：缓存 dl/ 目录（源码包）和 .config ----------
      - name: Cache OpenWrt downloads
        id: cache-openwrt
        uses: actions/cache@v4
        with:
          path: |
            immortalwrt-build/dl
            immortalwrt-build/.config
          key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('source-repo/immortalwrt/feeds.conf.default', 'main-repo/888/sl3000.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-
      # 说明：key 包含 feeds 配置和用户配置文件的哈希，当它们变化时缓存失效
      # 如果缓存命中，则会恢复 dl/ 和 .config，跳过下载和配置步骤

      - name: Run diy-part1.sh (Configuration & Package Purge)
        run: |
          chmod +x main-repo/diy-part1.sh
          cd main-repo
          ./diy-part1.sh

      - name: Run diy-part2.sh (Compile)
        run: |
          chmod +x main-repo/diy-part2.sh
          cd main-repo
          ./diy-part2.sh

      - name: List firmware files
        run: |
          echo "=== Generated firmware files ==="
          ls -la output/atf/ output/uboot/ output/firmware/ || true
          echo "=== Firmware directory contents ==="
          find output/ -type f -name "*.bin" -o -name "*.gz" -o -name "*sysupgrade*" | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 Firmware ${{ steps.release_tag.outputs.tag_name }}"
          body: |
            ## 自动构建的 SL3000 固件
            - 构建时间: ${{ steps.release_tag.outputs.tag_name }}
            - 包含 PassWall2, Shadowsocks, Docker 等软件包
            - 救砖全家桶: ATF, U-Boot, mtk_uartboot

            ### 📦 下载说明
            - `firmware/` 目录包含 sysupgrade 固件，可直接用于刷机
            - `atf/` 和 `uboot/` 为救砖文件
            - `mtk_uartboot.tar.gz` 为串口救砖工具
          files: |
            output/atf/*.bin
            output/atf/*.elf
            output/uboot/*.bin
            output/firmware/*.bin
            output/mtk_uartboot.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-firmware-${{ steps.release_tag.outputs.tag_name }}
          path: output/
