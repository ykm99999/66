name: Build SL3000 Rescue Bundle (32MB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 如果你的子模块是 git submodule

      - name: 🛠️ Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential flex bison gawk gettext git \
            libncurses5-dev libssl-dev python3 python3-distutils \
            rsync unzip zlib1g-dev device-tree-compiler bc jq

      - name: 🔧 Prepare Prebuilt Files
        run: |
          # 确保 prebuilt 目录存在（你需提前提交 bl2 和 factory）
          if [ ! -d "prebuilt" ]; then
            echo "❌ prebuilt/ 目录不存在，请提交 bl2-emmc-ddr4.bin 和 factory_orig.bin"
            exit 1
          fi
          if [ ! -f "prebuilt/bl2-emmc-ddr4.bin" ] || [ ! -f "prebuilt/factory_orig.bin" ]; then
            echo "❌ 缺少必需的 prebuilt 文件"
            exit 1
          fi

      - name: ▶️ Run Build Script
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh

      - name: 📤 Upload Rescue Image as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-32m
          path: output/sl3000-rescue-32m.bin
          retention-days: 30

      - name: 📊 Show Build Summary
        run: |
          echo "✅ 构建完成！"
          ls -lh output/
          sha256sum output/sl3000-rescue-32m.bin
