name: Build-SL3000-Official-24.10

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: 888/sl3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repo Assets
      uses: actions/checkout@v4 # 物理检出：你的 888 文件夹和 diy 脚本现在位于根目录

    - name: Free Disk Space & Init
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone OpenWrt Source
      run: |
        # 在根目录克隆，确保 openwrt 文件夹与 888 文件夹并列
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Load Custom Feeds
      run: |
        # 物理执行 diy-part1.sh
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Physical Inject 888 Assets
      run: |
        # 定义绝对物理路径，消除一切 cp 找不到文件的可能
        BASE_DIR="$GITHUB_WORKSPACE"
        SRC_DIR="$BASE_DIR/openwrt"
        ASSETS_DIR="$BASE_DIR/888"
        
        echo "Source Path: $SRC_DIR"
        echo "Assets Path: $ASSETS_DIR"

        # 1. 物理移除官方冗余零件
        rm -rf $SRC_DIR/package/boot/uboot-mediatek
        rm -rf $SRC_DIR/package/boot/arm-trusted-firmware-mediatek
        
        # 2. 物理注入 888 专属 Makefile
        mkdir -p $SRC_DIR/package/boot/uboot-mediatek
        cp -v $ASSETS_DIR/uboot-Makefile $SRC_DIR/package/boot/uboot-mediatek/Makefile
        
        mkdir -p $SRC_DIR/package/boot/arm-trusted-firmware-mediatek
        cp -v $ASSETS_DIR/atf-Makefile $SRC_DIR/package/boot/arm-trusted-firmware-mediatek/Makefile
        
        # 3. 物理注入引导补丁 (bl2_dev_spi_nor.c)
        mkdir -p $SRC_DIR/package/boot/arm-trusted-firmware-mediatek/files
        cp -v $ASSETS_DIR/bl2_dev_spi_nor.c $SRC_DIR/package/boot/arm-trusted-firmware-mediatek/files/
        
        # 4. 物理注入内核定义与镜像打包逻辑 (针对 24.10 路径)
        cp -v $ASSETS_DIR/mt7981-sl-3000-emmc.dts $SRC_DIR/target/linux/mediatek/dts/mt7981-sl-3000-emmc.dts
        cp -v $ASSETS_DIR/filogic.mk $SRC_DIR/target/linux/mediatek/image/filogic.mk
        
        echo "Physical Injection Done Successfully."

    - name: Load Config & DIY2
      run: |
        cd openwrt
        # 物理覆盖 .config 文件
        [ -e "$GITHUB_WORKSPACE/$CONFIG_FILE" ] && cp -f "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
        # 物理执行 diy-part2.sh
        chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
        "$GITHUB_WORKSPACE/$DIY_P2_SH"
        # 关键步骤：补全 6.6 内核硬件依赖
        make defconfig

    - name: Compile the Firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success'
      with:
        name: SL3000-Rescue-Bundle-Official-24.10
        path: openwrt/bin/targets/mediatek/filogic/
