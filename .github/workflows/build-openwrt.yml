name: OpenWrt-Build-SL3000-Stable

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ykm888/66.git
  REPO_BRANCH: 2410
  CONFIG_FILE: 888/sl3000.config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 物理环境准备
      uses: actions/checkout@v3

    - name: 物理安装依赖 (无损稳定版)
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        # 这里的列表涵盖了编译所需的全部依赖，不再依赖任何外部 is.gd 链接
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-setuptools python3-pyelftools swig zlib1g-dev \
        libelf-dev lrzsz scons autopoint qemu-utils upx-ucl rename antlr3 gperf wget curl device-tree-compiler
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 物理克隆源码
      run: |
        git clone $REPO_URL -b $REPO_BRANCH /workdir/openwrt

    - name: 物理执行 Feeds & DIY
      run: |
        cd /workdir/openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        # 赋予脚本执行权限并从项目根目录调用
        chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 物理编译
      run: |
        cd /workdir/openwrt
        [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
        make defconfig
        make -j$(nproc) || make -j1 V=s
