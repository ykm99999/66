name: SL3000 Final Build V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main (Scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout source (Firmware)
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Run diy-part1.sh
        run: |
          chmod +x main-repo/diy-part1.sh
          ./main-repo/diy-part1.sh

      - name: Run diy-part2.sh
        run: |
          chmod +x main-repo/diy-part2.sh
          ./main-repo/diy-part2.sh

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_id }}
          files: |
            output/atf/*.bin
            output/uboot/*.bin
            output/firmware/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
