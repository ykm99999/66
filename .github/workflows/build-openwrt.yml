name: SL-3000 Physical Hardening Build

on:
  push:
    paths:
      - '888/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 888 补丁仓库
        uses: actions/checkout@v4
        with:
          path: 888

      - name: 初始化 OpenWrt 环境
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gawk libncurses5-dev gettext libssl-dev xsltproc
          git clone --depth 1 https://github.com/coolsnowwolf/lede openwrt
          cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 准备源码 (Prepare Phase)
        run: |
          cd openwrt
          # 物理对齐：仅执行下载和解压，不进行原厂编译
          make package/boot/arm-trusted-firmware-mediatek/prepare V=s
          make package/boot/uboot-mediatek/prepare V=s

      - name: 执行物理注入 (Hardening Phase)
        run: |
          chmod +x ./888/patch_it.sh
          ./888/patch_it.sh

      - name: 物理执行 - 最终编译
        run: |
          cd openwrt
          # 准则：环境确定性 - 强制带参数启动
          make package/boot/arm-trusted-firmware-mediatek/compile V=s
          make package/boot/uboot-mediatek/compile V=s
          make target/linux/mediatek/image/compile V=s

      - name: 物理校验 (Alignment Check)
        run: |
          # 验证生成的 bl2.bin 里的 FIP 偏移是否为 0x100000
          BL2_PATH=$(find openwrt/bin/ -name "bl2.bin" | head -n 1)
          if [ -f "$BL2_PATH" ]; then
            echo "正在物理校验 $BL2_PATH..."
            # 搜索 1MB 偏移标志位
            hexdump -C "$BL2_PATH" | grep "00 00 10 00" || (echo "物理对齐失败：未检测到 1MB 偏移特征！" && exit 1)
          fi

      - name: 上传 SL-3000 救砖固件
        uses: actions/upload-artifact@v4
        with:
          name: SL3000-SPI-NOR-Hardened
          path: openwrt/bin/targets/mediatek/filogic/*
