name: Build SL-3000 Rescue Firmware

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 888/.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 物理环境初始化
      uses: actions/checkout@v4

    - name: 检查依赖并清理空间
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: 克隆上游源码 (成功案例基准)
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: 加载 Feeds 并运行 diy-part1.sh
      working-directory: ./openwrt
      run: |
        chmod +x ../$DIY_P1_SH
        ../$DIY_P1_SH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 物理注入：4文件覆盖并运行 diy-part2.sh
      run: |
        # 物理注入开关配置
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 下载软件包
      working-directory: ./openwrt
      run: |
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 物理编译 (单线程加固模式)
      id: compile
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread compile"
        # 物理策略：先尝试多线程，失败则转单线程诊断
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 物理收集产物 (32MB 救砖固件)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/mediatek/filogic
        # 查找并重命名那个 32MB 的关键文件
        find . -name "*nor-programmer-dump.bin" -exec mv {} SL-3000-Rescue-Full-Dump.bin \;
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: 上传救砖全家桶
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success'
      with:
        name: SL-3000-Rescue-Pack
        path: ${{ env.FIRMWARE_PATH }}/SL-3000-Rescue-Full-Dump.bin
