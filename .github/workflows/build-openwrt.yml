name: Build SL-3000 (Multi-Branch-Fix)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  # 底层源码：ykm888/66 的 2410 分支
  SOURCE_URL: https://github.com/ykm888/66
  SOURCE_BRANCH: 2410
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 物理检出配置 (Main 分支)
      uses: actions/checkout@v4
      with:
        ref: main
        path: config_repo  # 零件存放在这里，不被源码覆盖

    - name: 2. 物理环境筑基
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison g++-multilib gawk \
          gettext git libncurses-dev libssl-dev python3-distutils python3-pyelftools \
          python3-setuptools rsync swig unzip zlib1g-dev wget
        sudo timedatectl set-timezone "$TZ"

    - name: 3. 物理克隆源码 (2410 分支)
      run: |
        # 物理隔离：将源码放入独立的 openwrt 文件夹
        git clone --depth 1 $SOURCE_URL -b $SOURCE_BRANCH openwrt

    - name: 4. 执行物理注入 (Diy-Part2)
      run: |
        # 锁定脚本的绝对路径
        DIY_SH="$GITHUB_WORKSPACE/config_repo/888/diy-part2.sh"
        
        # 物理核验
        if [ ! -f "$DIY_SH" ]; then
          echo "!!! 物理故障：在 config_repo/888 中找不到脚本 !!!"
          ls -R $GITHUB_WORKSPACE/config_repo
          exit 1
        fi
        
        chmod +x "$DIY_SH"
        
        # 进入源码目录执行注入，传入配置仓库的绝对路径作为零件来源
        cd openwrt
        $DIY_SH "$GITHUB_WORKSPACE/config_repo"

    - name: 5. 编译全流程
      run: |
        cd openwrt
        ./scripts/feeds update -a && ./scripts/feeds install -a
        
        # 强制选中 888 注入的救砖包定义
        echo "CONFIG_TARGET_mediatek=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_sl_3000=y" >> .config
        echo "CONFIG_PACKAGE_arm-trusted-firmware-mediatek-mt7981-sl3000-nor=y" >> .config
        echo "CONFIG_PACKAGE_uboot-mediatek-mt7981_sl3000=y" >> .config
        
        make defconfig
        make -j$(nproc) || make -j1 V=s

    - name: 6. 提取产物
      run: |
        mkdir -p $GITHUB_WORKSPACE/output
        # 深度搜索生成的 32MB 编程器包
        find openwrt/bin/targets/ -name "*nor-programmer-dump.bin" -exec cp {} $GITHUB_WORKSPACE/output/ \;
        find openwrt/bin/targets/ -name "*emmc-sysupgrade.bin" -exec cp {} $GITHUB_WORKSPACE/output/ \;

    - name: 上传 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SL3000-Recovery-$(date +%Y%m%d)
        path: ${{ github.workspace }}/output/
