name: SL3000 Rescue Bundle Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential device-tree-compiler

      - name: Run diy-part1.sh (Prepare environment)
        run: |
          chmod +x main-repo/diy-part1.sh
          cd main-repo
          ./diy-part1.sh

      - name: Run diy-part2.sh (Build ATF/U-Boot & Create Rescue Image)
        run: |
          chmod +x main-repo/diy-part2.sh
          cd main-repo
          ./diy-part2.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-bundle
          path: output/

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SL3000 Rescue Bundle ${{ github.ref_name }}"
          files: |
            output/atf/*.bin
            output/uboot/*.bin
            output/mtk_uartboot.tar.gz
            output/Spi-flash-32MB-rescue.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
