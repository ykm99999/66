name: SL3000 Rescue Bundle Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential device-tree-compiler \
          bison flex libssl-dev python3-setuptools swig python3-dev gettext libncurses5-dev \
          zlib1g-dev gawk git rsync unzip

      - name: Prepare Sources & Config
        run: |
          # 执行 diy-part1.sh 准备环境（更新 feeds，注入 8000 行配置）
          chmod +x diy-part1.sh
          ./diy-part1.sh

      - name: Build & Package (The Core)
        run: |
          # 执行修复后的合成脚本
          chmod +x diy-part2.sh
          export GITHUB_WORKSPACE=$GITHUB_WORKSPACE
          ./diy-part2.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-bundle
          path: output/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: output/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
