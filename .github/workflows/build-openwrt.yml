name: SL3000_Rescue_Build_V1

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main (Scripts)
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout source (Codebase)
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Generate release tag
        id: release_tag
        run: echo "tag_name=v$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Initialize Environment & Clean Scripts
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-aarch64-linux-gnu device-tree-compiler gawk dos2unix
          
          # 物理清洗：防止 Windows 编码导致的脚本执行失败
          find main-repo/ -name "*.sh" -exec dos2unix {} +
          
          mkdir -p output/atf output/uboot output/firmware
          sudo chown -R runner:runner .

      - name: Run diy-part1
        run: |
          chmod +x main-repo/diy-part1.sh
          bash ./main-repo/diy-part1.sh

      - name: Run diy-part2
        run: |
          chmod +x main-repo/diy-part2.sh
          bash ./main-repo/diy-part2.sh

      - name: Physical Audit Artifacts
        run: |
          echo "=== 物理产物清单 ==="
          ls -R output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 救砖全家桶 V1 [${{ steps.release_tag.outputs.tag_name }}]"
          files: |
            output/firmware/SL3000_SPI_RESCUE_V1.bin
            output/firmware/*sysupgrade.bin
            output/atf/bl2-ram-1g.bin
            output/atf/bl2-1g-nor.bin
            output/uboot/fip-nor.bin
            output/mtk_uartboot.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
