name: SL3000 Slim Build

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install basic dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git wget curl unzip file \
            gcc-aarch64-linux-gnu libncurses-dev libssl-dev python3

      - name: Run DIY script
        run: |
          chmod +x diy-part1.sh
          ./diy-part1.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-firmware
          path: output/
