name: Build Rescue Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison libncurses-dev \
            libssl-dev libelf-dev bc u-boot-tools device-tree-compiler \
            gcc-aarch64-linux-gnu python3 python3-pip wget unzip file

      - name: Grant execute permission to scripts
        run: chmod +x diy-part1 diy-part2

      - name: Build components (diy-part1)
        run: ./diy-part1

      - name: Assemble 32M image (diy-part2)
        run: ./diy-part2

      - name: Upload rescue image
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-rescue-32M
          path: output/*.bin*
