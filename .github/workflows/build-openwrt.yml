name: SL3000_Rescue_Build_V2

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout main (Scripts & Configs)
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout source (ImmortalWrt Codebase)
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: sl3000-full-sync
          path: source-repo

      - name: Initialize Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-aarch64-linux-gnu device-tree-compiler \
            gawk dos2unix libncurses5-dev libssl-dev gettext zlib1g-dev \
            python3 python3-distutils python3-setuptools swig flex bison
          
          # 物理清洗：防止脚本编码问题
          find main-repo/ -name "*.sh" -exec dos2unix {} +
          chmod +x main-repo/*.sh
          
          mkdir -p output/atf output/uboot output/firmware
          sudo chown -R runner:runner .

      - name: Execute V2 Build Logic
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          # 像素级修正：直接在主流程中运行，确保环境变量与路径贯通
          ./main-repo/diy-part1.sh

      - name: Run Build and Collect Artifacts
        run: |
          # 进入编译目录执行最终打包
          cd immortalwrt-build
          
          # 物理产物提取：锁定特征码对齐的 BL2 与 FIP
          # 这里的路径需配合 diy-part1.sh 中生成的 bin 目录
          find bin/targets/mediatek/filogic/ -name "*bl2*" -exec cp {} ../output/atf/ \; || true
          find bin/targets/mediatek/filogic/ -name "*fip*" -exec cp {} ../output/uboot/ \; || true
          find bin/targets/mediatek/filogic/ -name "*sysupgrade.bin" -exec cp {} ../output/firmware/ \; || true

      - name: Generate release tag
        id: release_tag
        run: echo "tag_name=v$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (V2)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "SL3000 救砖全家桶 V2 [${{ steps.release_tag.outputs.tag_name }}]"
          body: |
            ### SL3000 V2 救砖固件更新说明：
            - **物理锁定**：1024MB DDR4 内存支持
            - **串口修正**：200MHz UART 时钟，解决 115200 乱码
            - **偏移对齐**：FIP 镜像锁定在 0x40000 (256KB)
          files: |
            output/firmware/*
            output/atf/*
            output/uboot/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
