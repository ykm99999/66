name: SL3000 Production Build (Factory Grade)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type: normal (1G), rescue (512M), both'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - rescue
          - both
      skip_self_heal:
        description: 'Skip self-healing (debug)'
        required: false
        default: false
        type: boolean

env:
  DEVICE: "sl3000"
  SOC: "mt7981"
  CONFIG_BRANCH: "main"
  SOURCE_BRANCH: "sl3000-full-sync"
  DTS_FILE: "mt7981-sl-3000-emmc"
  MK_FILE: "mt7981.mk"
  CONFIG_FILE: "sl3000.config"

jobs:
  build:
    # 根据输入决定当前矩阵任务是否运行
    if: |
      (github.event.inputs.build_type == 'normal' && matrix.memory == 1024) ||
      (github.event.inputs.build_type == 'rescue' && matrix.memory == 512) ||
      (github.event.inputs.build_type == 'both') ||
      (github.event.inputs.build_type == '' && matrix.memory == 1024)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        memory: [1024, 512]
        include:
          - memory: 1024
            suffix: 1g
            device_name: sl_3000-emmc-1g
          - memory: 512
            suffix: 512m
            device_name: sl_3000-emmc-512m

    steps:
      - name: Maximize build space
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Checkout config branch (main)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONFIG_BRANCH }}
          path: config-repo

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: ${{ env.SOURCE_BRANCH }}
          path: source-repo

      - name: Install dependencies (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            sudo apt update
            sudo apt install -y build-essential clang flex bison g++ gawk \
              gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
              python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget

      # ---------- 三件套自动检测/修复 ----------
      - name: Triple-file auto detect & heal
        id: triple_check
        run: |
          set -e
          cd config-repo/888

          EXPECTED_DTS="${DTS_FILE}-${{ matrix.suffix }}.dts"
          EXPECTED_MK="${MK_FILE}"
          EXPECTED_CONFIG="sl3000-${{ matrix.suffix }}.config"

          check_file() {
            if [ ! -f "$1" ]; then
              echo "❌ 缺失文件: $1"
              return 1
            fi
            echo "✅ 存在: $1"
            return 0
          }

          check_file "$EXPECTED_DTS" || need_repair_dts=1
          check_file "$EXPECTED_MK" || need_repair_mk=1
          check_file "$EXPECTED_CONFIG" || need_repair_config=1

          if [ "${{ github.event.inputs.skip_self_heal }}" == "true" ]; then
            echo "⏭️ 跳过自动修复"
          else
            # 修复 DTS：从模板生成（假设有 mt7981-sl-3000-emmc.template）
            if [ -n "$need_repair_dts" ]; then
              echo "🔧 正在修复 DTS: $EXPECTED_DTS"
              if [ -f "mt7981-sl-3000-emmc.template" ]; then
                sed "s/@MEMORY_SIZE@/${{ matrix.memory }}/" mt7981-sl-3000-emmc.template > "$EXPECTED_DTS"
                echo "✅ DTS 已从模板生成"
              else
                echo "❌ 无法修复 DTS：模板文件缺失"
                exit 1
              fi
            fi

            # 修复 MK
            if [ -n "$need_repair_mk" ]; then
              echo "🔧 正在修复 MK: $EXPECTED_MK"
              if [ -f "mt7981.mk.default" ]; then
                cp "mt7981.mk.default" "$EXPECTED_MK"
                echo "✅ MK 已从默认模板恢复"
              else
                echo "❌ 无法修复 MK：默认模板缺失"
                exit 1
              fi
            fi

            # 修复 config
            if [ -n "$need_repair_config" ]; then
              echo "🔧 正在修复 config: $EXPECTED_CONFIG"
              if [ -f "sl3000-base.config" ]; then
                cp "sl3000-base.config" "$EXPECTED_CONFIG"
                echo "CONFIG_DRAM_SIZE=${{ matrix.memory }}" >> "$EXPECTED_CONFIG"
                sed -i "s/CONFIG_TARGET_mediatek_filogic_DEVICE_.*/CONFIG_TARGET_mediatek_filogic_DEVICE_${{ matrix.device_name }}=y/" "$EXPECTED_CONFIG"
                echo "✅ config 已从基础模板生成"
              else
                echo "❌ 无法修复 config：基础模板缺失"
                exit 1
              fi
            fi
          fi

          # 最终验证
          check_file "$EXPECTED_DTS"
          check_file "$EXPECTED_MK"
          check_file "$EXPECTED_CONFIG"
          echo "status=ok" >> $GITHUB_OUTPUT

      # ---------- 编译 ATF ----------
      - name: Build ATF (${{ matrix.memory }}MB)
        id: build_atf
        continue-on-error: true
        run: |
          cd source-repo/arm-trusted-firmware
          make clean
          make PLAT=mt7981 DEBUG=0 DDR3_FLY=0 USE_NMBM=0 BOOT_DEVICE=emmc LOG_LEVEL=20 DRAM_SIZE=${{ matrix.memory }}
          mkdir -p $GITHUB_WORKSPACE/output/atf
          cp build/mt7981/release/bl2/bl2.elf $GITHUB_WORKSPACE/output/atf/bl2-${{ matrix.suffix }}.elf 2>/dev/null || true
          [ -f build/mt7981/release/bl2.bin ] && cp build/mt7981/release/bl2.bin $GITHUB_WORKSPACE/output/atf/bl2-${{ matrix.suffix }}.bin

      - name: ATF self-heal (retry)
        if: steps.build_atf.outcome == 'failure' && !inputs.skip_self_heal
        run: |
          echo "⚠️ ATF 编译失败，尝试清理后重试..."
          cd source-repo/arm-trusted-firmware
          make distclean
          make PLAT=mt7981 DEBUG=0 DDR3_FLY=0 USE_NMBM=0 BOOT_DEVICE=emmc LOG_LEVEL=20 DRAM_SIZE=${{ matrix.memory }}
          mkdir -p $GITHUB_WORKSPACE/output/atf
          cp build/mt7981/release/bl2/bl2.elf $GITHUB_WORKSPACE/output/atf/bl2-${{ matrix.suffix }}.elf 2>/dev/null || true
          [ -f build/mt7981/release/bl2.bin ] && cp build/mt7981/release/bl2.bin $GITHUB_WORKSPACE/output/atf/bl2-${{ matrix.suffix }}.bin

      - name: Check ATF status
        if: steps.build_atf.outcome == 'failure' && (inputs.skip_self_heal || failure())
        run: |
          echo "❌ ATF 编译失败，已尝试自愈，请查看日志"
          exit 1

      # ---------- 编译 U-Boot ----------
      - name: Build U-Boot
        id: build_uboot
        continue-on-error: true
        run: |
          cd source-repo/u-boot
          make clean
          if [ -f configs/mt7981_emmc_defconfig ]; then
            make mt7981_emmc_defconfig
          else
            make defconfig
          fi
          make -j$(nproc)
          mkdir -p $GITHUB_WORKSPACE/output/uboot
          [ -f fip.bin ] && cp fip.bin $GITHUB_WORKSPACE/output/uboot/fip-${{ matrix.suffix }}.bin
          [ -f u-boot.bin ] && cp u-boot.bin $GITHUB_WORKSPACE/output/uboot/u-boot-${{ matrix.suffix }}.bin

      - name: U-Boot self-heal (retry)
        if: steps.build_uboot.outcome == 'failure' && !inputs.skip_self_heal
        run: |
          echo "⚠️ U-Boot 编译失败，尝试清理后重试..."
          cd source-repo/u-boot
          make distclean
          if [ -f configs/mt7981_emmc_defconfig ]; then
            make mt7981_emmc_defconfig
          else
            make defconfig
          fi
          make -j$(nproc)
          mkdir -p $GITHUB_WORKSPACE/output/uboot
          [ -f fip.bin ] && cp fip.bin $GITHUB_WORKSPACE/output/uboot/fip-${{ matrix.suffix }}.bin
          [ -f u-boot.bin ] && cp u-boot.bin $GITHUB_WORKSPACE/output/uboot/u-boot-${{ matrix.suffix }}.bin

      - name: Check U-Boot status
        if: steps.build_uboot.outcome == 'failure' && (inputs.skip_self_heal || failure())
        run: |
          echo "❌ U-Boot 编译失败，已尝试自愈，请查看日志"
          exit 1

      # ---------- 编译 ImmortalWrt ----------
      - name: Prepare ImmortalWrt source
        run: |
          cp -r source-repo/immortalwrt $GITHUB_WORKSPACE/immortalwrt-${{ matrix.suffix }}
          cd $GITHUB_WORKSPACE/immortalwrt-${{ matrix.suffix }}
          cp $GITHUB_WORKSPACE/config-repo/888/${{ env.DTS_FILE }}-${{ matrix.suffix }}.dts target/linux/mediatek/dts/
          cp $GITHUB_WORKSPACE/config-repo/888/${{ env.MK_FILE }} target/linux/mediatek/image/
          cp $GITHUB_WORKSPACE/config-repo/888/sl3000-${{ matrix.suffix }}.config .config

      - name: Build ImmortalWrt
        id: build_ipq
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE/immortalwrt-${{ matrix.suffix }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make -j$(nproc) V=s 2>&1 | tee build.log
          mkdir -p $GITHUB_WORKSPACE/output/firmware-${{ matrix.suffix }}
          find bin/targets/ -name "*.bin" -o -name "*.img.gz" -o -name "*sysupgrade*" | \
            xargs -I {} cp {} $GITHUB_WORKSPACE/output/firmware-${{ matrix.suffix }}/
          cp build.log $GITHUB_WORKSPACE/output/firmware-${{ matrix.suffix }}/build.log

      - name: ImmortalWrt self-heal (clean & retry)
        if: steps.build_ipq.outcome == 'failure' && !inputs.skip_self_heal
        run: |
          echo "⚠️ ImmortalWrt 编译失败，清理后重试..."
          cd $GITHUB_WORKSPACE/immortalwrt-${{ matrix.suffix }}
          make clean
          make -j$(nproc) V=s 2>&1 | tee build.log
          mkdir -p $GITHUB_WORKSPACE/output/firmware-${{ matrix.suffix }}
          find bin/targets/ -name "*.bin" -o -name "*.img.gz" -o -name "*sysupgrade*" | \
            xargs -I {} cp {} $GITHUB_WORKSPACE/output/firmware-${{ matrix.suffix }}/
          cp build.log $GITHUB_WORKSPACE/output/firmware-${{ matrix.suffix }}/build.log

      - name: Check ImmortalWrt status
        if: steps.build_ipq.outcome == 'failure' && (inputs.skip_self_heal || failure())
        run: |
          echo "❌ ImmortalWrt 编译失败，已尝试自愈，请查看日志"
          exit 1

      # ---------- 打包 mtk_uartboot ----------
      - name: Package mtk_uartboot
        run: |
          cd source-repo/mtk_ua
