name: SL3000 Build for 2512 (6.12 Kernel)

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main branch (configs)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout 2512 branch (source)
        uses: actions/checkout@v4
        with:
          repository: ykm99999/66
          ref: 2512
          path: source-repo-2512

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            gcc-aarch64-linux-gnu device-tree-compiler

      - name: Optimize disk space
        run: |
          sudo apt clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Run diy-part3.sh (Configuration)
        run: |
          chmod +x main-repo/diy-part3.sh
          cd main-repo
          ./diy-part3.sh

      - name: Run diy-part4.sh (Compile)
        run: |
          chmod +x main-repo/diy-part4.sh
          cd main-repo
          ./diy-part4.sh

      - name: List firmware files
        run: |
          echo "=== Generated firmware files (2512) ==="
          ls -la output-2512/atf/ output-2512/uboot/ output-2512/firmware/ || true
          echo "=== Firmware directory contents ==="
          find output-2512/ -type f \( -name "*.bin" -o -name "*.gz" -o -name "*sysupgrade*" \) | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-firmware-2512
          path: output-2512/
